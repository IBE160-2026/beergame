# Railway service `backend` (FastAPI, AD-11). In the service settings, set the config file path
# to /railway/backend/railway.toml. Variables are set in Railway, never here (SETUP-GUIDE §3.1,
# §3.2, §3.3): APP_ENV=production, DATABASE_URL (session pooler, port 5432, sslmode=require),
# DB_POOL_SIZE, JWT_SECRET, PUBLIC_BASE_URL, EMAIL_FROM, RESEND_API_KEY, RESEND_WEBHOOK_SECRET,
# BOOTSTRAP_ADMIN_EMAILS, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, LOG_LEVEL.

[build]
builder = "DOCKERFILE"
# One image for backend, worker-ai and worker-batch, always from the same commit (AD-24).
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["/.dockerignore", "/backend/**", "/railway/backend/**"]

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"
# Only this service migrates (AD-24); migrations are expand-then-contract, so the old code keeps
# running during the overlap.
preDeployCommand = ["alembic upgrade head"]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
overlapSeconds = 60
drainingSeconds = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# EU West (Amsterdam), pinned (SETUP-GUIDE §2).
[deploy.multiRegionConfig.europe-west4-drams3a]
numReplicas = 1
