# Railway service `proxy` (Caddy, the only public service, AD-11). In the service settings, set
# the config file path to /railway/proxy/railway.toml. Variables are set in Railway, never here
# (SETUP-GUIDE §3.7): API_UPSTREAM=backend.railway.internal:8000,
# WEB_UPSTREAM=frontend.railway.internal:3000; Railway sets PORT.

[build]
builder = "DOCKERFILE"
dockerfilePath = "proxy/Dockerfile"
watchPatterns = ["/.dockerignore", "/proxy/**", "/railway/proxy/**"]

[deploy]
startCommand = "caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
# Through the proxy to backend, so a passing check means the whole api path works.
healthcheckPath = "/api/health"
healthcheckTimeout = 60
overlapSeconds = 30
drainingSeconds = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# EU West (Amsterdam), pinned (SETUP-GUIDE §2).
[deploy.multiRegionConfig.europe-west4-drams3a]
numReplicas = 1
