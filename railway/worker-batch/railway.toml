# Railway service `worker-batch`: LLM batches, mail and the per-minute sweeper (AD-9). In the
# service settings, set the config file path to /railway/worker-batch/railway.toml. Variables are
# set in Railway, never here: the same core set as backend (SETUP-GUIDE §3.1-§3.3), with its own
# DB_POOL_SIZE. One replica. During a deploy overlap the old and new process both run
# --sweeper; procrastinate defers each periodic tick once (a unique key per task and minute).

[build]
builder = "DOCKERFILE"
# The backend image, from the same commit as backend and worker-ai (AD-24).
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["/.dockerignore", "/backend/**", "/railway/worker-batch/**"]

[deploy]
# The queues that exist today; `reports-bulk` of SETUP-GUIDE §1 is added with Story 13.13.
# `reports-single` (Story 13.7) needs WEB_INTERNAL_URL=http://frontend.railway.internal:3000 and
# the storage keys; it runs on REPORTS_SINGLE_RESERVED slots of its own.
# No pre-deploy command (only backend migrates, AD-24) and no health check path (no HTTP).
startCommand = "python -m app.worker --queues llm-batch,mail,reports-single --sweeper"
overlapSeconds = 30
drainingSeconds = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# EU West (Amsterdam), pinned (SETUP-GUIDE §2).
[deploy.multiRegionConfig.europe-west4-drams3a]
numReplicas = 1
