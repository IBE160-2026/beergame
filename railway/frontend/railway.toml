# Railway service `frontend` (Next.js standalone, AD-10). In the service settings, set the
# config file path to /railway/frontend/railway.toml. Variables are set in Railway, never here:
# API_INTERNAL_URL=http://backend.railway.internal:8000 (SETUP-GUIDE §3.6).

[build]
builder = "DOCKERFILE"
dockerfilePath = "frontend/Dockerfile"
watchPatterns = ["/.dockerignore", "/frontend/**", "/railway/frontend/**"]

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
healthcheckTimeout = 60
overlapSeconds = 30
drainingSeconds = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# EU West (Amsterdam), pinned (SETUP-GUIDE §2).
[deploy.multiRegionConfig.europe-west4-drams3a]
numReplicas = 1
