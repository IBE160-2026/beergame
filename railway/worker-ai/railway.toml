# Railway service `worker-ai`: the AI Orders and their rescue loop (AD-5, AD-9). In the service
# settings, set the config file path to /railway/worker-ai/railway.toml. Variables are set in
# Railway, never here: the same core set as backend (SETUP-GUIDE §3.1-§3.3), with its own
# DB_POOL_SIZE, plus the provider key when LLM mode is used (§3.4).

[build]
builder = "DOCKERFILE"
# The backend image, from the same commit as backend and worker-batch (AD-24).
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["/.dockerignore", "/backend/**", "/railway/worker-ai/**"]

[deploy]
# No pre-deploy command: only backend migrates (AD-24). No health check path: a worker serves
# no HTTP; Railway restarts it when the process exits.
startCommand = "python -m app.worker --queues ai-orders"
overlapSeconds = 30
drainingSeconds = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# EU West (Amsterdam), pinned (SETUP-GUIDE §2).
[deploy.multiRegionConfig.europe-west4-drams3a]
numReplicas = 1
