<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1090" width="1200" height="1090" font-family="'Source Sans 3', 'Source Sans Pro', 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Fra krav til kode: epics, stories og sprintplan for ØL-spillet</title>
  <desc id="d">PRD, UX og arkitektur deles i epics. Hvert epic deles i stories med akseptansekriterier. Sprintplanen sjekker at planen er komplett og lager statusfila som byggingen følger. Inndelingen er et eksempel.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44586F"/>
    </marker>
    <style>
      .ink { fill: #0F2A47; }
      .sec { fill: #44586F; }
      .mut { fill: #5E6F82; }
      .lab { fill: #5E6F82; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; }
      .h { fill: #0F2A47; font-size: 15px; font-weight: 700; }
      .b { fill: #44586F; font-size: 13px; }
      .ref { fill: #5E6F82; font-size: 12px; font-variant-numeric: tabular-nums; }
      .box { fill: #FFFFFF; stroke: #C3CDD8; stroke-width: 1; }
      .sel { fill: #CDDFEE; stroke: #2B6CA3; stroke-width: 2; }
      .line { stroke: #44586F; stroke-width: 1.25; fill: none; }
      .hair { stroke: #E1E6EC; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="1090" fill="#FFFFFF"/>

  <!-- Tittel -->
  <text x="48" y="60" class="ink" font-size="30" font-weight="700">Fra krav til kode: epics, stories og sprintplan</text>
  <text x="48" y="86" class="sec" font-size="15">Eksempel fra ØL-spillet. Inndelingen i epics og stories er en illustrasjon; den endelige lages i neste steg.</text>

  <!-- 1 Grunnlag -->
  <text x="48" y="140" class="lab">1  GRUNNLAG</text>
  <text x="48" y="162" class="b">Ferdig og satt til final</text>

  <rect x="220" y="120" width="296" height="76" rx="4" class="box"/>
  <text x="236" y="146" class="h">PRD</text>
  <text x="236" y="166" class="b">Hva appen skal gjøre</text>
  <text x="236" y="184" class="ref">FR-1 … FR-89</text>

  <rect x="538" y="120" width="296" height="76" rx="4" class="box"/>
  <text x="554" y="146" class="h">UX</text>
  <text x="554" y="166" class="b">Hvordan den ser ut og oppfører seg</text>
  <text x="554" y="184" class="ref">DESIGN.md · EXPERIENCE.md</text>

  <rect x="856" y="120" width="296" height="76" rx="4" class="box"/>
  <text x="872" y="146" class="h">Arkitektur</text>
  <text x="872" y="166" class="b">Regler som holder delene konsistente</text>
  <text x="872" y="184" class="ref">AD-1 … AD-27</text>

  <path class="line" d="M368,196 V216 M1004,196 V216 M368,216 H1004"/>
  <path class="line" d="M686,196 V246" marker-end="url(#arrow)"/>

  <!-- 2 Epics -->
  <text x="48" y="272" class="lab">2  EPICS</text>
  <text x="48" y="294" class="b">En del av appen som</text>
  <text x="48" y="311" class="b">gir verdi alene og kan</text>
  <text x="48" y="328" class="b">vises fram når den er ferdig</text>

  <g>
    <rect x="220" y="252" width="142" height="92" rx="4" class="box"/>
    <text x="234" y="274" class="lab">EPIC 1</text>
    <text x="234" y="297" class="h">Spillmotor</text>
    <text x="234" y="315" class="h">og bokføring</text>
    <text x="234" y="334" class="ref">FR-29 · AD-1</text>

    <rect x="378" y="252" width="142" height="92" rx="4" class="box"/>
    <text x="392" y="274" class="lab">EPIC 2</text>
    <text x="392" y="297" class="h">Kontoer</text>
    <text x="392" y="315" class="h">og klasser</text>
    <text x="392" y="334" class="ref">FR-1 … FR-10</text>

    <rect x="536" y="252" width="142" height="92" rx="4" class="box"/>
    <text x="550" y="274" class="lab">EPIC 3</text>
    <text x="550" y="297" class="h">Klasseøkt</text>
    <text x="550" y="315" class="h">og grupper</text>
    <text x="550" y="334" class="ref">FR-11 … FR-22</text>

    <rect x="694" y="252" width="142" height="92" rx="4" class="sel"/>
    <text x="708" y="274" class="lab" style="fill:#1B4A75">EPIC 4</text>
    <text x="708" y="297" class="h">Spilling</text>
    <text x="708" y="315" class="h">uke for uke</text>
    <text x="708" y="334" class="ref" style="fill:#1B4A75">FR-23 … FR-28</text>

    <rect x="852" y="252" width="142" height="92" rx="4" class="box"/>
    <text x="866" y="274" class="lab">EPIC 5</text>
    <text x="866" y="297" class="h">KI-spillere</text>
    <text x="866" y="315" class="h">i ledige seter</text>
    <text x="866" y="334" class="ref">FR-30 … FR-34</text>

    <rect x="1010" y="252" width="142" height="92" rx="4" fill="#FFFFFF" stroke="#C3CDD8" stroke-dasharray="4 3"/>
    <text x="1024" y="274" class="lab">EPIC 6 OG UTOVER</text>
    <text x="1024" y="297" class="h">Debrief, test</text>
    <text x="1024" y="315" class="h">og rapporter</text>
    <text x="1024" y="334" class="ref">FR-41 … FR-65</text>
  </g>

  <path class="line" d="M765,344 V372 M306,372 H1066"/>
  <path class="line" d="M306,372 V396" marker-end="url(#arrow)"/>
  <path class="line" d="M496,372 V396" marker-end="url(#arrow)"/>
  <path class="line" d="M686,372 V396" marker-end="url(#arrow)"/>
  <path class="line" d="M876,372 V396" marker-end="url(#arrow)"/>
  <path class="line" d="M1066,372 V396" marker-end="url(#arrow)"/>

  <!-- 3 Stories -->
  <text x="48" y="422" class="lab">3  STORIES</text>
  <text x="48" y="444" class="b">Én bit som kan bygges,</text>
  <text x="48" y="461" class="b">testes og reviewes for</text>
  <text x="48" y="478" class="b">seg, med kilde i FR og AD</text>

  <g>
    <rect x="220" y="402" width="172" height="92" rx="4" class="box"/>
    <text x="234" y="424" class="lab">STORY 4.1</text>
    <text x="234" y="447" class="h">Se ukens tilstand</text>
    <text x="234" y="465" class="h">for mitt sete</text>
    <text x="234" y="484" class="ref">FR-23 · AD-3</text>

    <rect x="410" y="402" width="172" height="92" rx="4" class="sel"/>
    <text x="424" y="424" class="lab" style="fill:#1B4A75">STORY 4.2</text>
    <text x="424" y="447" class="h">Legge inn ordre</text>
    <text x="424" y="484" class="ref" style="fill:#1B4A75">FR-24 · AD-2</text>

    <rect x="600" y="402" width="172" height="92" rx="4" class="box"/>
    <text x="614" y="424" class="lab">STORY 4.3</text>
    <text x="614" y="447" class="h">Se hvem spillet</text>
    <text x="614" y="465" class="h">venter på</text>
    <text x="614" y="484" class="ref">FR-25 · AD-20</text>

    <rect x="790" y="402" width="172" height="92" rx="4" class="box"/>
    <text x="804" y="424" class="lab">STORY 4.4</text>
    <text x="804" y="447" class="h">Ukeskifte når alle</text>
    <text x="804" y="465" class="h">har bestilt</text>
    <text x="804" y="484" class="ref">FR-26 · AD-2</text>

    <rect x="980" y="402" width="172" height="92" rx="4" class="box"/>
    <text x="994" y="424" class="lab">STORY 4.5</text>
    <text x="994" y="447" class="h">Spillslutt og</text>
    <text x="994" y="465" class="h">kjedens kostnad</text>
    <text x="994" y="484" class="ref">FR-28</text>
  </g>

  <path class="line" d="M496,494 V528" marker-end="url(#arrow)" stroke="#2B6CA3"/>

  <!-- Story 4.2 åpnet -->
  <text x="48" y="554" class="lab">INNI EN STORY</text>
  <text x="48" y="576" class="b">Hvem, hva og hvorfor,</text>
  <text x="48" y="593" class="b">pluss kriterier som</text>
  <text x="48" y="610" class="b">avgjør når den er ferdig</text>

  <rect x="220" y="534" width="932" height="140" rx="4" fill="#F2F5F8" stroke="#2B6CA3" stroke-width="1"/>
  <text x="240" y="560" class="lab" style="fill:#1B4A75">STORY 4.2</text>
  <text x="240" y="588" class="ink" font-size="20" font-weight="600">Legge inn ordre</text>
  <text x="240" y="616" class="sec" font-size="14">Som student vil jeg legge inn én ordre per uke,</text>
  <text x="240" y="635" class="sec" font-size="14">slik at kjeden kan gå videre til neste uke.</text>
  <text x="240" y="660" class="ref">Kilde: FR-24 · Regel: AD-2, spilltilstand har én skrivevei</text>

  <path class="hair" d="M610,550 V658" stroke="#C3CDD8"/>

  <text x="634" y="560" class="lab">AKSEPTANSEKRITERIER</text>
  <g font-size="14" class="ink">
    <rect x="634" y="577" width="9" height="9" fill="none" stroke="#2B6CA3" stroke-width="1.5"/>
    <text x="654" y="587">Ordren er et heltall fra 0 til maksimum i spillinnstillingene.</text>
    <rect x="634" y="603" width="9" height="9" fill="none" stroke="#2B6CA3" stroke-width="1.5"/>
    <text x="654" y="613">Ugyldig tall avvises i feltet, før innsending.</text>
    <rect x="634" y="629" width="9" height="9" fill="none" stroke="#2B6CA3" stroke-width="1.5"/>
    <text x="654" y="639">Etter bekreftelse kan ordren ikke endres.</text>
  </g>

  <!-- 4 Sprintplan -->
  <path class="line" d="M335,674 V712" marker-end="url(#arrow)"/>
  <text x="347" y="698" class="ref">alle epics og stories</text>

  <text x="48" y="738" class="lab">4  SPRINTPLAN</text>
  <text x="48" y="760" class="b">Sjekker at planen holder,</text>
  <text x="48" y="777" class="b">og lager fila som viser</text>
  <text x="48" y="794" class="b">rekkefølge og status</text>

  <!-- Klarhetssjekk -->
  <rect x="220" y="718" width="230" height="160" rx="4" class="box"/>
  <text x="236" y="744" class="h">Klarhetssjekk</text>
  <text x="236" y="766" class="b">Er PRD, UX, arkitektur og</text>
  <text x="236" y="783" class="b">stories nok til å bygge?</text>
  <g font-size="11" font-weight="600" letter-spacing="0.6" text-anchor="middle">
    <rect x="236" y="804" width="50" height="22" rx="11" fill="#CDDFEE" stroke="#2B6CA3"/>
    <text x="261" y="819" fill="#1B4A75">PASS</text>
    <rect x="294" y="804" width="88" height="22" rx="11" fill="#F2F5F8" stroke="#C3CDD8"/>
    <text x="338" y="819" fill="#44586F">CONCERNS</text>
    <rect x="390" y="804" width="46" height="22" rx="11" fill="#F0D5D2" stroke="#B5423A"/>
    <text x="413" y="819" fill="#8C2C25">FAIL</text>
  </g>
  <text x="236" y="848" class="ref">PASS gir statusfila.</text>
  <text x="236" y="865" class="ref">FAIL sender oss tilbake til planen.</text>

  <path class="line" d="M450,798 H484" marker-end="url(#arrow)"/>

  <!-- Statusfil -->
  <rect x="490" y="718" width="410" height="160" rx="4" class="box"/>
  <text x="506" y="744" class="h">sprint-status.yaml</text>
  <text x="644" y="744" class="ref">eksempel midt i epic 4</text>

  <g font-size="10.5" class="mut" text-anchor="middle">
    <text x="675" y="766">backlog</text>
    <text x="725" y="766">klar</text>
    <text x="775" y="766">pågår</text>
    <text x="825" y="766">review</text>
    <text x="875" y="766">ferdig</text>
  </g>
  <path class="hair" d="M506,772 H888"/>

  <g font-size="12.5" class="ink">
    <text x="506" y="790">4.1 Se ukens tilstand</text>
    <text x="506" y="809">4.2 Legge inn ordre</text>
    <text x="506" y="828">4.3 Hvem spillet venter på</text>
    <text x="506" y="847">4.4 Ukeskifte</text>
    <text x="506" y="866">4.5 Spillslutt</text>
  </g>

  <!-- Spor: grå linje, mørk linje fram til status, punkt på status -->
  <g stroke="#E1E6EC" stroke-width="2">
    <path d="M675,786 H875"/>
    <path d="M675,805 H875"/>
    <path d="M675,824 H875"/>
    <path d="M675,843 H875"/>
    <path d="M675,862 H875"/>
  </g>
  <g fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1">
    <circle cx="675" cy="786" r="3"/><circle cx="725" cy="786" r="3"/><circle cx="775" cy="786" r="3"/><circle cx="825" cy="786" r="3"/><circle cx="875" cy="786" r="3"/>
    <circle cx="675" cy="805" r="3"/><circle cx="725" cy="805" r="3"/><circle cx="775" cy="805" r="3"/><circle cx="825" cy="805" r="3"/><circle cx="875" cy="805" r="3"/>
    <circle cx="675" cy="824" r="3"/><circle cx="725" cy="824" r="3"/><circle cx="775" cy="824" r="3"/><circle cx="825" cy="824" r="3"/><circle cx="875" cy="824" r="3"/>
    <circle cx="675" cy="843" r="3"/><circle cx="725" cy="843" r="3"/><circle cx="775" cy="843" r="3"/><circle cx="825" cy="843" r="3"/><circle cx="875" cy="843" r="3"/>
    <circle cx="675" cy="862" r="3"/><circle cx="725" cy="862" r="3"/><circle cx="775" cy="862" r="3"/><circle cx="825" cy="862" r="3"/><circle cx="875" cy="862" r="3"/>
  </g>
  <g stroke="#2B6CA3" stroke-width="2">
    <path d="M675,786 H875"/>
    <path d="M675,805 H775"/>
    <path d="M675,824 H725"/>
  </g>
  <g fill="#2B6CA3">
    <circle cx="875" cy="786" r="5"/>
    <circle cx="775" cy="805" r="5"/>
    <circle cx="725" cy="824" r="5"/>
  </g>
  <g fill="#5F7A95">
    <circle cx="675" cy="843" r="5"/>
    <circle cx="675" cy="862" r="5"/>
  </g>

  <path class="line" d="M900,798 H934" marker-end="url(#arrow)"/>

  <!-- Bygg -->
  <rect x="940" y="718" width="212" height="160" rx="4" class="box"/>
  <text x="956" y="744" class="lab">5  BYGG</text>
  <text x="956" y="770" class="h">Én story om gangen</text>
  <text x="956" y="792" class="b">Plan, kode, test og review.</text>
  <text x="956" y="809" class="b">Neste story hentes fra</text>
  <text x="956" y="826" class="b">statusfila.</text>
  <text x="956" y="858" class="ref">Epic ferdig: valgfri retrospektiv</text>

  <path class="line" d="M1046,878 V900 H695 V884" marker-end="url(#arrow)"/>
  <text x="870" y="917" class="ref" text-anchor="middle">status oppdateres etter hver story</text>

  <!-- Hvorfor -->
  <path class="hair" d="M48,944 H1152" stroke="#C3CDD8"/>
  <text x="48" y="974" class="lab">HVORFOR</text>
  <text x="48" y="996" class="b">Tre ting steget gir oss</text>

  <text x="220" y="974" class="h">Riktig størrelse</text>
  <text x="220" y="996" class="b">89 krav er for mye for én byggeøkt.</text>
  <text x="220" y="1013" class="b">En story er liten nok til at en agent</text>
  <text x="220" y="1030" class="b">kan bygge den ferdig og vi kan sjekke den.</text>

  <text x="538" y="974" class="h">Sporbarhet</text>
  <text x="538" y="996" class="b">Hver story peker til FR og AD. Da ser vi</text>
  <text x="538" y="1013" class="b">at alle krav er dekket, og at reglene i</text>
  <text x="538" y="1030" class="b">arkitekturen følges i hver bit.</text>

  <text x="856" y="974" class="h">Rekkefølge og status</text>
  <text x="856" y="996" class="b">Sprintplanen sier hva som bygges først</text>
  <text x="856" y="1013" class="b">og hvor langt vi har kommet, i én fil</text>
  <text x="856" y="1030" class="b">som alle byggeøkter leser og oppdaterer.</text>

  <text x="48" y="1066" class="ref">Kilder: prd.md (FR-23 til FR-29), ARCHITECTURE-SPINE.md (AD-1, AD-2, AD-3, AD-20), bmad-sprint-planning.</text>
</svg>
