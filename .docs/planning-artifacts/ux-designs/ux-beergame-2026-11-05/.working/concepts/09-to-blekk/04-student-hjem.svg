<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="'Libre Franklin','Franklin Gothic Book','Arial Narrow',Arial,sans-serif">
<title>Sara på mobil</title>
<desc>To telefoner. Venstre: registrering fra Invitasjon. Høyre: hjem under spill, cyan fordi Sara står i restordre, med spillet som venter, de andre setene, de seks stegene, neste frist og Labtimer.</desc>
