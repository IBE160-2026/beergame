y="396" class="c05-t" font-size="21" font-weight="400" fill="#FFFFFF">Invitasjon til PDF-rapport for klasser på rundt 250 studenter.</text><rect x="100" y="442" width="240" height="58" rx="8" fill="#F0D04E" /><text x="220" y="477.8" class="c05-d" font-size="20" font-weight="700" fill="#06303A" text-anchor="middle">Be om lærertilgang</text><rect x="356" y="442" width="130" height="58" rx="8" fill="none" stroke="#FFFFFF" stroke-width="1.5" /><text x="421" y="477.8" class="c05-d" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Logg inn</text><text x="82" y="598" class="c05-t" font-size="24" font-weight="700" fill="#FFFFFF">Lager 0</text><text x="82" y="648" class="c05-t" font-size="19" font-weight="700" fill="#06303A">Restordre: tørr grunn under null</text><text x="82" y="770" class="c05-d" font-size="124" font-weight="800" fill="#06303A">13</text><text x="507" y="548" class="c05-d" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="519.8" y="646" class="c05-c" font-size="19" font-weight="500" fill="#FFFFFF" text-anchor="middle">Uke 12</text><text x="666.6" y="548" class="c05-d" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="679.4" y="646" class="c05-c" font-size="19" font-weight="500" fill="#FFFFFF" text-anchor="middle">Uke 13</text><text x="835.8" y="492" class="c05-d" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">8</text><text x="850.4" y="646" class="c05-c" font-size="19" font-weight="500" fill="#FFFFFF" text-anchor="middle">Uke 14</text><path d="M448,662 L448,670 L933.6,670 L933.6,662" fill="none" stroke="#FFFFFF" stroke-width="2"/><text x="690.8" y="712" class="c05-d" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">16 er allerede på vei</text><text x="690.8" y="742" class="c05-t" font-size="19" font-weight="400" fill="#CFEDE8" text-anchor="middle">Det er ikke lett å se når hullet er 13.</text><text x="1078.4" y="646" class="c05-c" font-size="19" font-weight="700" fill="#F0D04E" text-anchor="middle">Uke 15</text><text x="1244" y="646" class="c05-t" font-size="18" font-weight="500" fill="#FFFFFF">Dette ser en</text><text x="1244" y="671" class="c05-t" font-size="18" font-weight="500" fill="#FFFFFF">Grossist i Uke 11.</text><text x="1244" y="696" class="c05-t" font-size="18" font-weight="500" fill="#FFFFFF">Beslutningen er ett</text><text x="1244" y="721" class="c05-t" font-size="18" font-weight="500" fill="#FFFFFF">heltall.</text><text x="82" y="826" class="c05-c" font-size="15" font-weight="500" fill="#CFEDE8">Demodata</text><text x="100" y="884" class="c05-d" font-size="46" font-weight="800" fill="#FFFFFF">Fire seter,</text><text x="100" y="936" class="c05-d" font-size="46" font-weight="800" fill="#FFFFFF">samme vann.</text><text x="100" y="976" class="c05-t" font-size="19" font-weight="400" fill="#FFFFFF">Hver student ser sitt eget Lager, sin egen Restordre</text><text x="100" y="1003" class="c05-t" font-size="19" font-weight="400" fill="#FFFFFF">og det som er på vei. Ingen ser de andres tall.</text><g transform="translate(700,936) scale(1.9)"><path d="M-3,-33 L-19,-39 L-19,-27 Z M3,-33 L19,-39 L19,-27 Z" fill="#F0D04E" fill-opacity="0.6"/><path d="M-7,0 L-4.5,-26 L4.5,-26 L7,0 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.4"/><path d="M-6.1,-11 L-5.6,-17 L5.6,-17 L6.1,-11 Z" fill="#FF7A63"/><rect x="-6.5" y="-28" width="13" height="2" rx="0" fill="#FFFFFF" /><rect x="-3.5" y="-37" width="7" height="9" rx="0" fill="#F0D04E" stroke="#FFFFFF" stroke-width="1.4" /><path d="M-4.5,-37 L0,-42 L4.5,-37 Z" fill="#FFFFFF"/></g><text x="700" y="966" class="c05-d" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Detaljist</text><text x="700" y="990" class="c05-c" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Har bestilt</text><g transform="translate(900,936) scale(1.9)"><path d="M-7,0 L-4.5,-26 L4.5,-26 L7,0 Z" fill="none" stroke="#CFEDE8" stroke-width="1.4"/><rect x="-6.5" y="-28" width="13" height="2" rx="0" fill="#CFEDE8" /><rect x="-3.5" y="-37" width="7" height="9" rx="0" fill="none" stroke="#CFEDE8" stroke-width="1.4" /><path d="M-4.5,-37 L0,-42 L4.5,-37 Z" fill="#CFEDE8"/></g><text x="900" y="966" class="c05-d" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Grossist</text><text x="900" y="990" class="c05-c" font-size="18" font-weight="500" fill="#CFEDE8" text-anchor="middle">Venter 3 min</text><g transform="translate(1100,936) scale(1.9)"><path d="M-3,-33 L-19,-39 L-19,-27 Z M3,-33 L19,-39 L19,-27 Z" fill="#F0D04E" fill-opacity="0.6"/><path d="M-7,0 L-4.5,-26 L4.5,-26 L7,0 Z" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-dasharray="2.5 2"/><rect x="-6.5" y="-28" width="13" height="2" rx="0" fill="#FFFFFF" /><path d="M0,-38 L4,-35.5 L4,-30.5 L0,-28 L-4,-30.5 L-4,-35.5 Z" fill="#F0D04E" stroke="#FFFFFF" stroke-width="1"/></g><text x="1100" y="966" class="c05-d" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Distributør</text><text x="1100" y="990" class="c05-c" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">KI-spiller</text><g transform="translate(1300,936) scale(1.9)"><path d="M-3,-33 L-19,-39 L-19,-27 Z M3,-33 L19,-39 L19,-27 Z" fill="#F0D04E" fill-opacity="0.6"/><path d="M-7,0 L-4.5,-26 L4.5,-26 L7,0 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.4"/><path d="M-6.1,-11 L-5.6,-17 L5.6,-17 L6.1,-11 Z" fill="#FF7A63"/><rect x="-6.5" y="-28" width="13" height="2" rx="0" fill="#FFFFFF" /><rect x="-3.5" y="-37" width="7" height="9" rx="0" fill="#F0D04E" stroke="#FFFFFF" stroke-width="1.4" /><path d="M-4.5,-37 L0,-42 L4.5,-37 Z" fill="#FFFFFF"/></g><text x="1300" y="966" class="c05-d" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fabrikk</text><text x="1300" y="990" class="c05-c" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Har bestilt</text><line x1="100" y1="1056" x2="700" y2="1056" s