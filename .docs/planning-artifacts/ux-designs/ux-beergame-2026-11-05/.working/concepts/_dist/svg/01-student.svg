<text x="376" y="273" font-size="15" font-weight="600" fill="#BE1224" text-anchor="end" class="c01-b" >det er deg</text><line x1="14" y1="282" x2="376" y2="282" stroke="#9DB2A8" stroke-width="0.6" /><line x1="16.55" y1="286" x2="16.55" y2="306.4" stroke="#10264B" stroke-width="1.36" /><line x1="14" y1="306.4" x2="19.1" y2="306.4" stroke="#10264B" stroke-width="1.36" /><g transform="rotate(-48 16.55 291.1)"><rect x="16.55" y="288.98" width="11.9" height="4.25" fill="#10264B" /></g><text x="38" y="304" font-size="15" font-weight="700" fill="#10264B" text-anchor="start" class="c01-b" >Distributør</text><text x="120" y="304" font-size="15" font-weight="500" fill="#10264B" text-anchor="start" class="c01-b" >Mikkel</text><text x="376" y="304" font-size="15" font-weight="600" fill="#384E6E" text-anchor="end" class="c01-b" >bestilt</text><line x1="14" y1="313" x2="376" y2="313" stroke="#9DB2A8" stroke-width="0.6" /><line x1="16.55" y1="317" x2="16.55" y2="337.4" stroke="#10264B" stroke-width="1.36" /><line x1="14" y1="337.4" x2="19.1" y2="337.4" stroke="#10264B" stroke-width="1.36" /><rect x="16.55" y="319.55" width="11.9" height="4.25" fill="#BE1224" /><rect x="24.2" y="319.55" width="1.7" height="4.25" fill="#FFFFFF" /><text x="38" y="335" font-size="15" font-weight="700" fill="#10264B" text-anchor="start" class="c01-b" >Fabrikk</text><text x="120" y="335" font-size="15" font-weight="500" fill="#10264B" text-anchor="start" class="c01-b" >Jonas</text><text x="376" y="335" font-size="15" font-weight="600" fill="#BE1224" text-anchor="end" class="c01-b" >venter 3 min</text><line x1="14" y1="344" x2="376" y2="344" stroke="#9DB2A8" stroke-width="0.6" /><text x="14" y="372" font-size="17" font-weight="800" fill="#10264B" text-anchor="start" class="c01-o" >Stegene dine</text><line x1="22" y1="392" x2="22" y2="537" stroke="#10264B" stroke-width="3" /><circle cx="22" cy="392" r="7" fill="#F5B800" stroke="#10264B" stroke-width="2"/><text x="40" y="397" font-size="16" font-weight="80