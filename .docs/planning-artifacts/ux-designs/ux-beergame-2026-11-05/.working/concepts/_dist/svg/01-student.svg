sen</text><text x="18" y="778" font-size="15" font-weight="500" fill="#384E6E" text-anchor="start" class="c01-b" >Invitasjonen er gyldig til to. 19. nov.</text><line x1="10" y1="811" x2="380" y2="811" stroke="#10264B" stroke-width="2" /><line x1="10" y1="811" x2="10" y2="827" stroke="#10264B" stroke-width="1.4" /><text x="14" y="826" font-size="13" font-weight="500" fill="#10264B" text-anchor="start" class="c01-b" >Spillfrist ti. 8. des</text><line x1="127.31" y1="811" x2="127.31" y2="827" stroke="#10264B" stroke-width="1.4" /><text x="131.31" y="826" font-size="13" font-weight="500" fill="#10264B" text-anchor="start" class="c01-b" >Debrief-frist fr. 11. des</text><line x1="265.69" y1="811" x2="265.69" y2="827" stroke="#10264B" stroke-width="1.4" /><text x="269.69" y="826" font-size="13" font-weight="500" fill="#10264B" text-anchor="start" class="c01-b" >Testfrist fr. 18. des</text></g></g><g transform="translate(548 28) scale(1)"><rect x="-8" y="-8" width="406" height="860" fill="#10264B" rx="38" /><g clip-path="url(#c01-hjem-skjerm2)"><rect x="0" y="0" width="390" height="844" fill="#E4ECE7" /><rect x="0" y="0" width="390" height="844" fill="#E4ECE7" /><rect x="0" y="0" width="390" height="62" fill="#F1F5F2" /><line x1="0" y1="62" x2="390" y2="62" stroke="#10264B" stroke-width="1.4" /><text x="14" y="28" font-size="13" font-weight="600" fill="#384E6E" text-anchor="start" class="c01-b" >Spill 17</text><text x="14" y="48" font-size="19" font-weight="800" fill="#10264B" text-anchor="start" class="c01-o" >Grossist, Sara</text><text x="376" y="42" font-size="15" font-weight="700" fill="#10264B" text-anchor="end" class="c01-b" >Obligatorisk</text><rect x="12" y="74" width="366" height="112" fill="#10264B" rx="3" /><rect x="26" y="92" width="30" height="44" fill="#F1F5F2" rx="2" /><g transform="translate(-6 0)"><line x1="43.9" y1="96" x2="43.9" y2="127.2" stroke="#10264B" stroke-width="2.08" /><line x1="40" y1="127.2" x2="47.8" y2="127.2" stroke="#10264B" stroke-width="2