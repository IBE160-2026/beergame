<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" font-family="'Schibsted Grotesk','Figtree','Segoe UI',system-ui,sans-serif" class="c10-root"><title>Tråden: landingsside for faglærere</title><desc>Mørk aubergine forside med en ekte spilltråd i aksjon, og en lys seksjon som viser faglærerens egen tråd fra Invitasjon til PDF-rapport.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&amp;display=swap');.c10-n{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1,'lnum' 1;}</style><rect width="1440" height="1200" fill="#1E0E25"/><line x1="102.8" y1="31.5" x2="102.8" y2="56.5" stroke="#F7EFF5" stroke-width="2" /><circle cx="102.8" cy="35.0" r="3.8636363636363638" fill="#F7EFF5" /><circle cx="102.8" cy="45.2" r="3.8636363636363638" fill="#F7EFF5" /><rect x="98.3" y="52.0" width="9.1" height="9.1" fill="#CFF25A" rx="1.5" /><text x="116.5" y="53.1" font-size="25" font-weight="800" fill="#F7EFF5" letter-spacing="-0.2" >Tråden</text><text x="1072.0" y="52.0" font-size="16" font-weight="600" fill="#F7EFF5" >Logg inn</text><rect x="1150.0" y="25.0" width="194.0" height="42.0" fill="none" rx="21" stroke="#C8B5D0" stroke-width="1" /><text x="1247.0" y="52.0" font-size="15" font-weight="600" fill="#F7EFF5" text-anchor="middle" >Be om lærertilgang</text><text x="96.0" y="186.0" font-size="74" font-weight="800" fill="#F7EFF5" letter-spacing="-1.6" >Hele kjeden,</text><text x="96.0" y="262.0" font-size="74" font-weight="800" fill="#F7EFF5" letter-spacing="-1.6" >i en tråd</text><text x="96.0" y="338.0" font-size="74" font-weight="800" fill="#F7EFF5" letter-spacing="-1.6" >studentene</text><text x="96.0" y="414.0" font-size="74" font-weight="800" fill="#F7EFF5" letter-spacing="-1.6" >åpner selv.</text><text x="96.0" y="476.0" font-size="21" font-weight="400" fill="#F7EFF5" >Fire studenter, fire Roller, ett tall per Uke.</text><text x="96.0" y="506.0" font-size="21" font-weight="400" fill="#F7EFF5" >Spillet går over flere kvelder, og ett fravær</text><text x="96.0" y="536.0" font-size="21" font-weight="400" fill="#F7EFF5" >stopper ikke gruppa: en KI-spiller fyller tomme</text><text x="96.0" y="566.0" font-size="21" font-weight="400" fill="#F7EFF5" >seter, tydelig merket.</text><rect x="96.0" y="604.0" width="258.0" height="62.0" fill="#CFF25A" rx="14" /><text x="225.0" y="643.0" font-size="20" font-weight="800" fill="#1E0E25" text-anchor="middle" >Be om lærertilgang</text><text x="382.0" y="642.0" font-size="19" font-weight="600" fill="#F7EFF5" >Logg inn</text><line x1="382.0" y1="649.0" x2="462.0" y2="649.0" stroke="#C8B5D0" stroke-width="1.4" /><path transform="translate(96.0 698.0) scale(0.875)" d="M6 3h8l4 4v14H6z M14 3v4h4" fill="none" stroke="#86E8C2" stroke-width="2.17" stroke-linecap="round" stroke-linejoin="round"/><text x="128.0" y="714.0" font-size="17" font-weight="400" fill="#F7EFF5" >Studentlisten lastes opp fra Canvas-eksport</text><path transform="translate(96.0 731.0) scale(0.875)" d="M15 9a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0 M4.5 20c.8-4 3.5-6 7-6s6.2 2 7 6" fill="none" stroke="#86E8C2" stroke-width="2.17" stroke-linecap="round" stroke-linejoin="round"/><text x="128.0" y="747.0" font-size="17" font-weight="400" fill="#F7EFF5" >Laget for klasser på rundt <tspan class="c10-n">250</tspan> studenter</text><path transform="translate(96.0 764.0) scale(0.875)" d="M4 11l8-7 8 7 M6 10v10h12V10" fill="none" stroke="#86E8C2" stroke-width="2.17" stroke-linecap="round" stroke-linejoin="round"/><text x="128.0" y="780.0" font-size="17" font-weight="400" fill="#F7EFF5" >Spilles på mobil, på norsk</text><rect x="748.0" y="96.0" width="596.0" height="672.0" fill="#26122E" rx="26" stroke="#5A3566" stroke-width="1" /><g transform="translate(762 106) scale(1.36)"><path d="M13 16.4L22.6 26L13 35.6L3.4000000000000004 26Z" fill="#CFF25A" stroke="#CFF25A" stroke-width="1.6" /><text x="31.0" y="24.0" font-size="16" font-weight="800" fill="#F7EFF5" >Spill <tspan class="c10-n">17</tspan> · Grossist</text><text x="31.0" y="42.0" font-size="13" font-weight="400" fill="#C8B5D0" >Demodata</text><path transform="translate(2.0 56.0) scale(0.625)" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#86E8C2" stroke-width="3.84" stroke-linecap="round" stroke-linejoin="round"/><text x="23.0" y="68.0" font-size="13" font-weight="400" fill="#C8B5D0" ><tspan font-weight="600" fill="#F7EFF5">Detaljist</tspan> Ida har bestilt</text><path transform="translate(2.0 75.0) scale(0.625)" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#86E8C2" stroke-width="3.84" stroke-linecap="round" stroke-linejoin="round"/><text x="23.0" y="87.0" font-size="13" font-weight="400" fill="#C8B5D0" ><tspan font-weight="600" fill="#F7EFF5">Distributør</tspan> Mikkel har bestilt</text><path d="M1.5 101.5L5.5 94.3L13.5 94.3L17.5 101.5L13.5 108.7L5.5 108.7Z" fill="#CDBDFF" /><text x="9.5" y="104.4" font-size="8.049999999999999" font-weight="800" fill="#1E0E25" text-anchor="middle" letter-spacing="0.2" >KI</text><text x="23.0" y="106.0" font-size="13" font-weight="400" fill="#C8B5D0" ><tspan font-weight="600" fill="#F7EFF5">Fabrikk</tspan> Jonas er borte. KI-spiller har setet</text><clipPath id="c10-landing-clip1"><rect x="-4" y="112" width="425.6470588235294" height="262"/></clipPath><g clip-path="url(#c10-landing-clip1)"><line x1="0.0" y1="48.0" x2="159.7" y2="48.0" stroke="#5A3566" stroke-width="1" /><line x1="258.0" y1="48.0" x2="417.6" y2="48.0" stroke="#5A3566" stroke-width="1" /><text x="208.8" y="53.0" font-size="13" font-weight="500" fill="#C8B5D0" text-anchor="middle" >Mandag <tspan class="c10-n">20</tspan>:<tspan class="c10-n">14</tspan></text><path d="M258.6470588235294 63H404.6470588235294L417.6470588235294 76V126Q417.6470588235294 135 408.6470588235294 135H258.6470588235294Q249.6470588235294 135 249.6470588235294 126V72Q249.6470588235294 63 258.6470588235294 63Z" fill="#3B2146" stroke="#5A3566" stroke-width="1" /><circle cx="396.6" cy="75.0" r="2.6" fi