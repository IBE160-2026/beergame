x="12.0" y="454.0" font-size="25" font-weight="800" fill="#F7EFF5" ><tspan class="c10-n">12</tspan></text><rect x="104.5" y="413.5" width="8.0" height="8.0" fill="none" rx="1" stroke="#FFB18A" stroke-width="1.1" /><line x1="105.0" y1="421.0" x2="112.0" y2="414.0" stroke="#FFB18A" stroke-width="1.1" /><text x="117.0" y="422.0" font-size="13" font-weight="500" fill="#C8B5D0" >Restordre</text><text x="104.0" y="454.0" font-size="25" font-weight="800" fill="#F7EFF5" ><tspan class="c10-n">0</tspan></text><rect x="196.5" y="413.5" width="8.0" height="8.0" fill="none" rx="1" stroke="#86E8C2" stroke-width="1.1" /><text x="209.0" y="422.0" font-size="13" font-weight="500" fill="#C8B5D0" >På vei</text><text x="196.0" y="454.0" font-size="25" font-weight="800" fill="#86E8C2" ><tspan class="c10-n">12</tspan></text></g><rect x="0.0" y="836.0" width="1440.0" height="364.0" fill="#F6F0F3" /><text x="96.0" y="912.0" font-size="46" font-weight="800" fill="#2A1231" letter-spacing="-1" >Din tråd er hele</text><text x="96.0" y="964.0" font-size="46" font-weight="800" fill="#2A1231" letter-spacing="-1" >kurset.</text><text x="96.0" y="1024.0" font-size="19" font-weight="400" fill="#2A1231" >Fra Invitasjon til PDF-rapport. Alle spillene på</text><text x="96.0" y="1052.0" font-size="19" font-weight="400" fill="#2A1231" >én skjerm, og det som trenger deg ligger øverst.</text><text x="96.0" y="1080.0" font-size="19" font-weight="400" fill="#2A1231" >Ingen spill blir stående uferdig.</text><text x="96.0" y="1130.0" font-size="14" font-weight="500" fill="#64506C" >Demodata</text><rect x="690.0" y="868.0" width="654.0" height="56.0" fill="#FFFFFF" rx="12" stroke="#DFD2DE" stroke-width="1" /><path transform="translate(704.0 884.0) scale(1.000)" d="M6 3h8l4 4v14H6z M14 3v4h4" fill="none" stroke="#4A2157" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/><text x="740.0" y="902.0" font-size="16" font-weight="400" fill="#2A1231" >Klasselisten er lest: <tspan font-weight="700"><tspan class="c10-n">250</tspan> rader</tspan> fra Canvas-eksport, <tspan font-weight="700"><tspan class="c10-n">4</tspan> ugyldige</tspan> adresser.</text><rect x="690.0" y="931.0" width="654.0" height="56.0" fill="#FFFFFF" rx="12" stroke="#DFD2DE" stroke-width="1" /><path transform="translate(704.0 947.0) scale(1.000)" d="M15 9a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0 M4.5 20c.8-4 3.5-6 7-6s6.2 2 7 6" fill="none" stroke="#4A2157" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/><text x="740.0" y="965.0" font-size="16" font-weight="400" fill="#2A1231" ><tspan font-weight="700"><tspan class="c10-n">240</tspan> studenter</tspan> er fordelt i <tspan font-weight="700"><tspan class="c10-n">60</tspan> spill</tspan> à <tspan class="c10-n">4</tspan>.</text><rect x="690.0" y="994.0" width="654.0" height="56.0" fill="#FBE7DD" rx="12" stroke="#A5350F" stroke-width="1.4" /><path transform="translate(704.0 1010.0) scale(1.000)" d="M21 12a9 9 0 1 1-18 0a9 9 0 1 1 18 0 M12 7v5l3.2 2" fill="none" stroke="#A5350F" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/><text x="740.0" y="1028.0" font-size="16" font-weight="400" fill="#2A1231" ><tspan font-weight="700">Spill <tspan class="c10-n">2</tspan></tspan> venter på Noah (Grossist), <tspan class="c10-n">23</tspan> t. KI overtar om <tspan class="c10-n">1</tspan> t.</text><rect x="1198.0" y="1004.0" width="134.0" height="36.0" fill="#CFF25A" rx="9" stroke="#2A1231" stroke-width="1" /><text x="1265.0" y="1027.5" font-size="15" font-weight="700" fill="#1E0E25" text-anchor="middle" >Send Melding</text><rect x="690.0" y="1057.0" width="654.0" height="56.0" fill="#FFFFFF" rx="12" stroke="#DFD2DE" stroke-width="1" /><path transform="translate(704.0 1073.0) scale(1.000)" d="M8 5v14 M16 5v14" fill="none" stroke="#4A2157" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/><text x="740.0" y="1091.0" font-size="16" font-weight="400" fill="#2A1231" ><tspan font-weight="700">Spill <tspan class="c10-n">20</tspan></tspan> er pauset. Fortsetter i kveld <tspan class="c10-n">19</tspan>:<tspan class="c10-n">00</tspan>.</text><rect x="690.0" y="1120.0" width="654.0" height="56.0" fill="#FFFFFF" rx="12" stroke="#DFD2DE" stroke-width="1" /><path transform="translate(704.0 1136.0) scale(1.000)" d="M6 3h12v18H6z M9 8h6 M9 12h6 M9 16h4" fill="none" stroke="#4A2157" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"/><text x="740.0" y="1154.0" font-size="16" font-weight="400" fill="#2A1231" >Klasserapporten ligger klar som PDF når spillene er over.</text></svg>