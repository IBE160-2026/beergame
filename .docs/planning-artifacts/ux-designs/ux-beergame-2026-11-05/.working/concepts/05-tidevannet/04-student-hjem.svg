<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="'Barlow','Segoe UI','Helvetica Neue',Arial,sans-serif"><title>Tidevann: Sara på mobil, første møte og hjem</title><desc>To telefoner. Venstre er Invitasjon og registrering. Høyre er hjem under spill med Spill 17, Grossist, de andre setene, seks steg på én linje, neste frist og Labtimer.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap');.c05-d{font-family:'Bricolage Grotesque','Trebuchet MS','Segoe UI',sans-serif;letter-spacing:-0.01em}.c05-t{font-family:'Barlow','Segoe UI','Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums lining-nums}.c05-c{font-family:'Barlow Semi Condensed','Barlow','Arial Narrow',Arial,sans-serif;font-variant-numeric:tabular-nums lining-nums}</style><rect width="1000" height="900" fill="#05303A"/><g transform="translate(28,26) scale(1.0)"><clipPath id="c05-student-hjem-skjerm1"><rect width="390" height="844" rx="38"/></clipPath><g clip-path="url(#c05-student-hjem-skjerm1)"><rect width="390" height="844" fill="#08434C"/><path d="M20,51.3 c5.8,0 5.8,-12 11,-12 s4.8,12 12,12" fill="none" stroke="#FFFFFF" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round" /><text x="47.4" y="58" class="c05-d" font-size="24" font-weight="700" fill="#FFFFFF">Tidevann</text><text x="18" y="122" class="c05-d" font-size="36" font-weight="800" fill="#FFFFFF">Bård har invitert</text><text x="18" y="162" class="c05-d" font-size="36" font-weight="800" fill="#FFFFFF">deg til IBE160.</text><text x="18" y="198" class="c05-t" font-size="17" font-weight="400" fill="#FFFFFF">class-of-1994. Du skal spille en</text><text x="18" y="222" class="c05-t" font-size="17" font-weight="400" fill="#FFFFFF">forsyningskjede sammen med tre andre. Det</text><text x="18" y="246" class="c05-t" font-size="17" font-weight="400" fill="#FFFFFF">gjør du på mobilen, gjerne over flere</text><text x="18" y="270" class="c05-t" font-size="17" font-weight="400" fill="#FFFFFF">kvelder.</text><text x="18" y="306" class="c05-c" font-size="14" font-weight="500" fill="#CFEDE8">Navn</text><rect x="18" y="314" width="354" height="48" rx="6" fill="#FFFFFF" /><text x="32" y="345" class="c05-t" font-size="18" font-weight="600" fill="#06303A">Sara Lien</text><text x="18" y="388" class="c05-c" font-size="14" font-weight="500" fill="#CFEDE8">E-post fra Klasselista</text><rect x="18" y="396" width="354" height="48" rx="6" fill="#0B5F66" /><text x="32" y="427" class="c05-t" font-size="17" font-weight="500" fill="#FFFFFF">sara.l@student.example</text><text x="18" y="470" class="c05-c" font-size="14" font-weight="500" fill="#CFEDE8">Lag passord</text><rect x="18" y="478" width="354" height="48" rx="6" fill="#FFFFFF" /><circle cx="36" cy="502" r="4" fill="#06303A"/><circle cx="51" cy="502" r="4" fill="#06303A"/><circle cx="66" cy="502" r="4" fill="#06303A"/><circle cx="81" cy="502" r="4" fill="#06303A"/><circle cx="96" cy="502" r="4" fill="#06303A"/><circle cx="111" cy="502" r="4" fill="#06303A"/><circle cx="126" cy="502" r="4" fill="#06303A"/><circle cx="141" cy="502" r="4" fill="#06303A"/><circle cx="156" cy="502" r="4" fill="#06303A"/><circle cx="171" cy="502" r="4" fill="#06303A"/><rect x="18" y="544" width="354" height="58" rx="8" fill="#F0D04E" /><text x="195" y="580.1" class="c05-d" font-size="21" font-weight="700" fill="#06303A" text-anchor="middle">Opprett konto</text><text x="195" y="628" class="c05-t" font-size="14" font-weight="500" fill="#CFEDE8" text-anchor="middle">Invitasjonen er gyldig i 14 dager.</text><path d="M0,700 L390,700 L390,844 L0,844 Z" fill="#0B5F66"/><path d="M0,700 L392,700" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><text x="18" y="740" class="c05-t" font-size="15" font-weight="400" fill="#FFFFFF">Når du er inne, ser du setet ditt, de</text><text x="18" y="762" class="c05-t" font-size="15" font-weight="400" fill="#FFFFFF">andre tre og hva som skjer når.</text><text x="18" y="792" class="c05-c" font-size="13" font-weight="500" fill="#CFEDE8">Demodata</text></g><rect width="390" height="844" rx="38" fill="none" stroke="#CFEDE8" stroke-width="2.5"/></g><text x="436" y="70" class="c05-d" font-size="18" font-weight="800" fill="#FFFFFF">Første møte</text><text x="436" y="94" class="c05-t" font-size="14" font-weight="400" fill="#CFEDE8">Stille vann. Ingen</text><text x="436" y="113" class="c05-t" font-size="14" font-weight="400" fill="#CFEDE8">tall ennå. Linja</text><text x="436" y="132" class="c05-t" font-size="14" font-weight="400" fill="#CFEDE8">ligger klar.</text><text x="436" y="178" class="c05-d" font-size="17" font-weight="800" fill="#FFFFFF">Hjem under spill</text><text x="436" y="202" class="c05-t" font-size="14" font-weight="400" fill="#CFEDE8">Samme linje, nå med</text><text x="436" y="221" class="c05-t" font-size="14" font-weight="400" fill="#CFEDE8">fyrlykter og steg.</text><text x="436" y="240" class="c05-t" font-size="14" font-weight="400" fill="#CFEDE8">Gul flate: noen</text><text x="436" y="259" class="c05-t" font-size="14" font-weight="400" fill="#CFEDE8">venter på deg.</text><path d="M418,726 C526,726 476,294 582,294" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(582,26) scale(1.0)"><clipPath id="c05-student-hjem-skjerm2"><rect width="390" height="844" rx="38"/></clipPath><g clip-path="url(#c05-student-hjem-skjerm2)"><rect width="390" height="844" fill="#08434C"/><text x="18" y="50" class="c05-d" font-size="34" font-weight="800" fill="#FFFFFF">Spill 17</text><text x="372" y="33" class="c05-d" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="end">Grossist</text><text x="372" y="52" class="c05-c" font-size="13" font-weight="400" fill="#CFEDE8" text-anchor="end">class-of-1994</text><rect x="18" y="70" width="354" height="112" rx="10" fill="#F0D04E" /><text x="34" y="102" class="c05-d" font-size="23" font-weight="800" fill="#06303A">Spillet venter på deg</text><text x="34" y="126" class="c05-t" font-size="15" font-weight="500" fill="#06303A">Uke 11. Jonas har heller ikke bestilt.</text><rect x="34" y="136" width="322" height="36" rx="6" fill="#06303A" /><text x="195" y="160" class="c05-d" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Gå til Uke 11</text><text x="18" y="212" class="c05-d" font-size="17" font-weight="700" fill="#FFFFFF">Setene</text><g transform="translate(54,268) scale(1.15)"><path d="M-3,-33 L-19,-39 L-19,-27 Z M3,-33 L19,-39 L19,-27 Z" fill="#F0D04E" fill-opacity="0.6"/><path d="M-7,0 L-4.5,-26 L4.5,-26 L7,0 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.4"/><path d="M-6.1,-11 L-5.6,-17 L5.6,-17 L6.1,-11 Z" fill="#FF7A63"/><rect x="-6.5" y="-28" width="13" height="2" rx="0" fill="#FFFFFF" /><rect x="-3.5" y="-37" width="7" height="9" rx="0" fill="#F0D04E" stroke="#FFFFFF" stroke-width="1.4" /><path d="M-4.5,-37 L0,-42 L4.5,-37 Z" fill="#FFFFFF"/></g><text x="54" y="288" class="c05-c" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Detaljist</text><text x="54" y="305" class="c05-c" font-size="13" font-weight="400" fill="#CFEDE8" text-anchor="middle">Ida</text><text x="54" y="321" class="c05-c" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Har bestilt</text><g transform="translate(148,268) scale(1.15)"><path d="M-7,0 L-4.5,-26 L4.5,-26 L7,0 Z" fill="none" stroke="#CFEDE8" stroke-width="1.4"/><rect x="-6.5" y="-28" width="13" height="2" rx="0" fill="#CFEDE8" /><rect x="-3.5" y="-37" width="7" height="9" rx="0" fill="none" stroke="#CFEDE8" stroke-width="1.4" /><path d="M-4.5,-37 L0,-42 L4.5,-37 Z" fill="#CFEDE8"/></g><text x="148" y="288" class="c05-c" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Grossist</text><text x="148" y="305" class="c05-c" font-size="13" font-weight="400" fill="#CFEDE8" text-anchor="middle">Sara (du)</text><text x="148" y="321" class="c05-c" font-size="13" font-weight="400" fill="#CFEDE8" text-anchor="middle">Venter</text><g transform="translate(242,268) scale(1.15)"><path d="M-3,-33 L-19,-39 L-19,-27 Z M3,-33 L19,-39 L19,-27 Z" fill="#F0D04E" fill-opacity="0.6"/><path d="M-7,0 L-4.5,-26 L4.5,-26 L7,0 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.4"/><path d="M-6.1,-11 L-5.6,-17 L5.6,-17 L6.1,-11 Z" fill="#FF7A63"/><rect x="-6.5" y="-28" width="13" height="2" rx="0" fill="#FFFFFF" /><rect x="-3.5" y="-37" width="7" height="9" rx="0" fill="#F0D04E" stroke="#FFFFFF" stroke-width="1.4" /><path d="M-4.5,-37 L0,-42 L4.5,-37 Z" fill="#FFFFFF"/></g><text x="242" y="288" class="c05-c" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Distributør</text><text x="242" y="305" class="c05-c" font-size="13" font-weight="400" fill="#CFEDE8" text-anchor="middle">Mikkel</text><text x="242" y="321" class="c05-c" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Har bestilt</text><g transform="translate(336,268) scale(1.15)"><path d="M-7,0 L-4.5,-26 L4.5,-26 L7,0 Z" fill="none" stroke="#CFEDE8" stroke-width="1.4"/><rect x="-6.5" y="-28" width="13" height="2" rx="0" fill="#CFEDE8" /><rect x="-3.5" y="-37" width="7" height="9" rx="0" fill="none" stroke="#CFEDE8" stroke-width="1.4" /><path d="M-4.5,-37 L0,-42 L4.5,-37 Z" fill="#CFEDE8"/></g><text x="336" y="288" class="c05-c" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Fabrikk</text><text x="336" y="305" class="c05-c" font-size="13" font-weight="400" fill="#CFEDE8" text-anchor="middle">Jonas</text><text x="336" y="321" class="c05-c" font-size="13" font-weight="400" fill="#CFEDE8" text-anchor="middle">Venter 3 min</text><text x="18" y="374" class="c05-d" font-size="17" font-weight="700" fill="#FFFFFF">Stegene dine</text><path d="M0,402 L390,402 L390,844 L0,844 Z" fill="#0B5F66"/><path d="M0,268 L392,268" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M392,268 Q384,268 384,278 L384,392 Q384,402 374,402 L0,402" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="47.5" cy="402" r="9" fill="#F0D04E" stroke="#06303A" stroke-width="1.5"/><text x="47.5" y="430" class="c05-c" font-size="13" font-weight="700" fill="#F0D04E" text-anchor="middle">Klassespill</text><circle cx="106.5" cy="402" r="7" fill="#0B5F66" stroke="#FFFFFF" stroke-width="2"/><text x="106.5" y="430" class="c05-c" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">Debrief</text><circle cx="165.5" cy="402" r="7" fill="#0B5F66" stroke="#FFFFFF" stroke-width="2"/><text x="165.5" y="430" class="c05-c" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">Quiz</text><circle cx="224.5" cy="402" r="7" fill="#0B5F66" stroke="#FFFFFF" stroke-width="2"/><text x="224.5" y="430" class="c05-c" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">Replay</text><circle cx="283.5" cy="402" r="7" fill="#0B5F66" stroke="#FFFFFF" stroke-width="2"/><text x="283.5" y="430" class="c05-c" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">Individuell</text><text x="283.5" y="446" class="c05-c" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">test</text><circle cx="342.5" cy="402" r="7" fill="#0B5F66" stroke="#FFFFFF" stroke-width="2"/><text x="342.5" y="430" class="c05-c" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">Rapport</text><text x="47.5" y="447" class="c05-c" font-size="13" font-weight="700" fill="#F0D04E" text-anchor="middle">Nå</text><text x="18" y="506" class="c05-c" font-size="15" font-weight="500" fill="#CFEDE8">Neste frist</text><text x="18" y="536" class="c05-d" font-size="25" font-weight="800" fill="#FFFFFF">Spillfrist ti. 8. des</text><text x="18" y="558" class="c05-t" font-size="15" font-weight="400" fill="#CFEDE8">Etterpå fullfører KI-spillere det som gjenstår.</text><text x="18" y="610" class="c05-d" font-size="17" font-weight="700" fill="#FFFFFF">Labtimer, Datalab A2</text><text x="18" y="638" class="c05-t" font-size="16" font-weight="500" fill="#FFFFFF">to. 26. nov 14:15</text><text x="198" y="638" class="c05-t" font-size="16" font-weight="500" fill="#FFFFFF">ma. 30. nov 10:15</text><text x="18" y="664" class="c05-t" font-size="16" font-weight="500" fill="#FFFFFF">to. 3. des 14:15</text><text x="198" y="664" class="c05-t" font-size="16" font-weight="500" fill="#FFFFFF">ma. 7. des 10:15</text><text x="18" y="728" class="c05-c" font-size="13" font-weight="500" fill="#CFEDE8">Demodata</text><text x="372" y="728" class="c05-c" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="end" text-decoration="underline">Pause og regler</text></g><rect width="390" height="844" rx="38" fill="none" stroke="#CFEDE8" stroke-width="2.5"/></g></svg>