<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="'Epilogue','Hanken Grotesk','Helvetica Neue',Arial,sans-serif"><title>Modell: Sara på mobil</title><desc>To telefoner: registrering fra Invitasjon, og hjem under spill med seter, seks steg, frist og Labtimer.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap');.d01-t{font-family:'Epilogue','Hanken Grotesk','Helvetica Neue',Arial,sans-serif;}.d01-n{font-family:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1,'lnum' 1;}</style><defs><pattern id="d01-04-student-hjem-hatch" width="4.2" height="4.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4.2" height="4.2" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="4.2" stroke="#23272B" stroke-width="0.9"/></pattern><pattern id="d01-04-student-hjem-kihatch" width="3.6" height="3.6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="3.6" height="3.6" fill="#E7EEF4"/><line x1="0" y1="0" x2="0" y2="3.6" stroke="#225A93" stroke-width="0.9"/></pattern></defs><rect width="1000" height="900" fill="#F5F6F5"/><text class="d01-t" x="40.00" y="24.00" font-size="14" font-weight="400" fill="#555C63" xml:space="preserve">Registrering fra Invitasjon</text><g transform="translate(40 36)"><rect x="0.00" y="0.00" width="390.00" height="844.00" fill="#F5F6F5" stroke="#23272B" stroke-width="1" rx="30"/><text class="d01-t" x="16.00" y="60.00" font-size="18" font-weight="600" fill="#23272B" xml:space="preserve">Modell</text><text class="d01-t" x="16.00" y="116.00" font-size="28" font-weight="600" fill="#23272B" xml:space="preserve">Bård har invitert deg</text><text class="d01-t" x="16.00" y="150.00" font-size="28" font-weight="600" fill="#23272B" xml:space="preserve">til IBE<tspan class="d01-n">160</tspan>.</text><text class="d01-t" x="16.00" y="188.00" font-size="15" font-weight="400" fill="#555C63" xml:space="preserve">Du spiller en Rolle i en forsyningskjede</text><text class="d01-t" x="16.00" y="210.00" font-size="15" font-weight="400" fill="#555C63" xml:space="preserve">sammen med tre andre. Du bruker noen</text><text class="d01-t" x="16.00" y="232.00" font-size="15" font-weight="400" fill="#555C63" xml:space="preserve">minutter per Uke, på mobil, når det passer</text><text class="d01-t" x="16.00" y="254.00" font-size="15" font-weight="400" fill="#555C63" xml:space="preserve">gruppa.</text><text class="d01-t" x="16.00" y="292.00" font-size="13" font-weight="400" fill="#555C63" xml:space="preserve">Navn</text><rect x="16.00" y="298.00" width="358.00" height="46.00" fill="#FFFFFF" stroke="#B3B9BD" stroke-width="0.9"/><text class="d01-t" x="26.00" y="326.25" font-size="15" font-weight="400" fill="#23272B" xml:space="preserve">Sara Lie</text><text class="d01-t" x="16.00" y="366.00" font-size="13" font-weight="400" fill="#555C63" xml:space="preserve">E-post, fra Klasselisten</text><rect x="16.00" y="372.00" width="358.00" height="46.00" fill="#FFFFFF" stroke="#B3B9BD" stroke-width="0.9"/><text class="d01-t" x="26.00" y="400.25" font-size="15" font-weight="400" fill="#23272B" xml:space="preserve">sara.lie@student.no</text><text class="d01-t" x="16.00" y="440.00" font-size="13" font-weight="400" fill="#555C63" xml:space="preserve">Velg passord</text><rect x="16.00" y="446.00" width="358.00" height="46.00" fill="#FFFFFF" stroke="#B3B9BD" stroke-width="0.9"/><text class="d01-t" x="26.00" y="474.25" font-size="15" font-weight="400" fill="#23272B" xml:space="preserve">••••••••••••</text><text class="d01-t" x="16.00" y="514.00" font-size="13" font-weight="400" fill="#555C63" xml:space="preserve">Minst <tspan class="d01-n">10</tspan> tegn.</text><rect x="16.00" y="532.00" width="358.00" height="56.00" fill="#23272B"/><text class="d01-t" x="195.00" y="565.60" font-size="16" font-weight="500" fill="#F5F6F5" text-anchor="middle" xml:space="preserve">Opprett konto</text><text class="d01-t" x="16.00" y="620.00" font-size="14" font-weight="400" fill="#555C63" xml:space="preserve">Invitasjonen er gyldig i <tspan class="d01-n">14</tspan> dager. Spillet</text><text class="d01-t" x="16.00" y="640.00" font-size="14" font-weight="400" fill="#555C63" xml:space="preserve">starter ti. <tspan class="d01-n">24</tspan>. nov.</text></g><text class="d01-t" x="540.00" y="24.00" font-size="14" font-weight="400" fill="#555C63" xml:space="preserve">Hjem under spill</text><g transform="translate(540 36)"><rect x="0.00" y="0.00" width="390.00" height="844.00" fill="#F5F6F5" stroke="#23272B" stroke-width="1" rx="30"/><text class="d01-t" x="16.00" y="60.00" font-size="26" font-weight="600" fill="#23272B" xml:space="preserve">Spill <tspan class="d01-n">17</tspan>, Grossist</text><text class="d01-t" x="16.00" y="82.00" font-size="14" font-weight="400" fill="#555C63" xml:space="preserve">IBE<tspan class="d01-n">160</tspan>, class-of-<tspan class="d01-n">1994</tspan></text><rect x="16.00" y="100.00" width="358.00" height="104.00" fill="#FFFFFF" stroke="#23272B" stroke-width="1.2"/><text class="d01-t" x="30.00" y="130.00" font-size="18" font-weight="600" fill="#23272B" xml:space="preserve">Spillet venter på deg: Uke <tspan class="d01-n">11</tspan></text><text class="d01-t" x="30.00" y="152.00" font-size="14" font-weight="400" fill="#555C63" xml:space="preserve">Jonas venter også, <tspan class="d01-n">3</tspan> min.</text><rect x="30.00" y="160.00" width="330.00" height="34.00" fill="#23272B"/><text class="d01-t" x="195.00" y="181.90" font-size="14" font-weight="500" fill="#F5F6F5" text-anchor="middle" xml:space="preserve">Gå til Uke <tspan class="d01-n">11</tspan></text><text class="d01-t" x="16.00" y="236.00" font-size="15" font-weight="600" fill="#23272B" xml:space="preserve">Setene</text><rect x="16.00" y="248.00" width="86.50" height="72.00" fill="#FFFFFF" stroke="#B3B9BD" stroke-width="0.7"/><text class=