<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Mulish,Segoe UI,Helvetica,Arial,sans-serif"><title>Lag: Saras hjem</title><desc>To telefoner: registrering fra Invitasjon, og hjem mens spillet venter på Sara.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;700&amp;display=swap');.d09-t{font-family:'Mulish','Segoe UI',Helvetica,Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums;}.d09-u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;}.d09-h{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round;}</style><defs><pattern id="d09-04-skravur" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#9C9C9C" stroke-width="1"/></pattern></defs><rect id="d09-04-grunn" x="0" y="0" width="1000" height="900" fill="#FFFFFF"/><g transform="translate(60 28) scale(1)"><rect x="0.5" y="0.5" width="389" height="843" rx="38" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><text class="d09-t" x="20.0" y="62.0" font-size="17" font-weight="700" fill="#111111">Lag</text><text class="d09-t" x="20.0" y="148.0" font-size="34" font-weight="300" fill="#111111">Du er invitert</text><text class="d09-t" x="20.0" y="186.0" font-size="16" font-weight="400" fill="#5C5C5C">Bård har invitert deg til Klassen</text><text class="d09-t" x="20.0" y="209.0" font-size="16" font-weight="400" fill="#5C5C5C">class-of-1994 i IBE160. Invitasjonen er</text><text class="d09-t" x="20.0" y="232.0" font-size="16" font-weight="400" fill="#5C5C5C">gyldig i 14 dager.</text><text class="d09-t" x="20.0" y="291.0" font-size="15" font-weight="400" fill="#5C5C5C">E-post</text><text class="d09-t" x="20.0" y="321.0" font-size="18" font-weight="400" fill="#111111">sara@student.example.no</text><line x1="20.0" y1="333.0" x2="370.0" y2="333.0" stroke="#D4D4D4" stroke-width="1" fill="none"/><text class="d09-t" x="20.0" y="369.0" font-size="15" font-weight="400" fill="#5C5C5C">Navn</text><text class="d09-t" x="20.0" y="399.0" font-size="18" font-weight="400" fill="#111111">Sara</text><line x1="20.0" y1="411.0" x2="370.0" y2="411.0" stroke="#D4D4D4" stroke-width="1" fill="none"/><text class="d09-t" x="20.0" y="447.0" font-size="15" font-weight="400" fill="#5C5C5C">Passord</text><line x1="21.0" y1="459.0" x2="21.0" y2="481.0" stroke="#DB3A12" stroke-width="2" fill="none"/><line x1="20.0" y1="489.0" x2="370.0" y2="489.0" stroke="#D4D4D4" stroke-width="1" fill="none"/><text class="d09-t" x="20.0" y="529.0" font-size="13" font-weight="400" fill="#5C5C5C">Minst 10 tegn.</text><rect x="20.0" y="712.0" width="350.0" height="56.0" fill="#111111" rx="2"/><text class="d09-t" x="195.0" y="746.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Opprett konto</text></g><g transform="translate(550 28) scale(1)"><rect x="0.5" y="0.5" width="389" height="843" rx="38" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/><text class="d09-t" x="20.0" y="62.0" font-size="17" font-weight="700" fill="#111111">Spill 17</text><text class="d09-t" x="370.0" y="62.0" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="end">Sara</text><text class="d09-t" x="20.0" y="124.0" font-size="30" font-weight="300" fill="#DB3A12">Spillet venter på deg.</text><text class="d09-t" x="20.0" y="158.0" font-size="15" font-weight="400" fill="#5C5C5C">Du er Grossist. Jonas har heller ikke bestilt.</text><text class="d09-t" x="20.0" y="179.0" font-size="15" font-weight="400" fill="#5C5C5C">Det har gått 3 min.</text><rect x="20.0" y="210.0" width="350.0" height="56.0" fill="#111111" rx="2"/><text class="d09-t" x="195.0" y="243.9" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Åpne Uke 11</text><text class="d09-t" x="20.0" y="304.0" font-size="15" font-weight="400" fill="#5C5C5C">Setene</text><text class="d09-t" x="20.0" y="332.0" font-size="15"><tspan font-weight="400" fill="#111111">Ida</tspan><tspan font-weight="400" fill="#5C5C5C">, Detaljist</tspan></text><text class="d09-t" x="370.0" y="332.0" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="end">har bestilt</text><text class="d09-t" x="20.0" y="359.0" font-size="15"><tspan font-weight="700" fill="#111111">Sara</tspan><tspan font-weight="400" fill="#5C5C5C">, Grossist</tspan></text><text class="d09-t" x="370.0" y="359.0" font-size="15" font-weight="700" fill="#111111" text-anchor="end">venter (deg)</text><text class="d09-t" x="20.0" y="386.0" font-size="15"><tspan font-weight="400" fill="#111111">Mikkel</tspan><tspan font-weight="400" fill="#5C5C5C">, Distributør</tspan></text><text class="d09-t" x="370.0" y="386.0" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="end">har bestilt</text><text class="d09-t" x="20.0" y="413.0" font-size="15"><tspan font-weight="700" fill="#111111">Jonas</tspan><tspan font-weight="400" fill="#5C5C5C">, Fabrikk</tspan></text><text class="d09-t" x="370.0" y="413.0" font-size="15" font-weight="700" fill="#111111" text-anchor="end">venter, 3 min</text><text class="d09-t" x="20.0" y="452.0" font-size="15" font-weight="400" fill="#5C5C5C">Stegene</text><text class="d09-t" x="20.0" y="480.0" font-size="16" font-weight="700" fill="#111111">Klassespill</text><text class="d09-t" x="370.0" y="480.0" font-size="15" font-weight="700" fill="#DB3A12" text-anchor="end">nå</text><text class="d09-t" x="20.0" y="507.0" font-size="16" font-weight="400" fill="#5C5C5C">Debrief</text><text class="d09-t" x="20.0" y="534.0" font-size="16" font-weight="400" fill="#5C5C5C">Quiz</text><text class="d09-t" x="20.0" y="561.0" font-size="16" font-weight="400" fill="#5C5C5C">Replay</text><text class="d09-t" x="20.0" y="588.0" font-size="16" font-weight="400" fill="#5C5C5C">Individuell test</text><text class="d09-t" x="20.0" y="615.0" font-size="16" font-weight="400" fill="#5C5C5C">Rapport</text><text class="d09-t" x="20.0" y="656.0" font-size="15"><tspan font-weight="400" fill="#5C5C5C">Neste frist  </tspan><tspan font-weight="700" fill="#111111">Spillfrist ti. 8. des</tspan></text><text class="d09-t" x="20.0" y="682.0" font-size="15"><tspan font-weight="400" fill="#5C5C5C">Labtime  </tspan><tspan font-weight="400" fill="#111111">to. 26. nov 14:15, Datalab A2</tspan></text></g><text class="d09-t" x="60.0" y="892.0" font-size="13" font-weight="400" fill="#5C5C5C">Demodata</text></svg>