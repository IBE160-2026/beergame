<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Posisjon: Sara på mobil</title><desc>Registrering og hjem under spill.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;display=swap');.d05-t{font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums lining-nums;}.d05-p{font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:proportional-nums lining-nums;}</style><rect x="0" y="0" width="1000" height="900" fill="#FFFFFF"/><text class="d05-t" x="40.00" y="44.00" font-size="24" font-weight="500" fill="#101010">Registrering og hjem</text><text class="d05-t" x="960.00" y="44.00" font-size="13" font-weight="400" fill="#696969" text-anchor="end">Demodata</text><g transform="translate(40.00 68.00) scale(0.95)"><rect x="0.00" y="0.00" width="390.00" height="844.00" fill="#FFFFFF" stroke="#C4C4C4" stroke-width="1" rx="30"/><text class="d05-t" x="20.00" y="62.00" font-size="15" font-weight="600" fill="#101010">Posisjon</text><text class="d05-t" x="20.00" y="124.00" font-size="36" font-weight="500" fill="#101010">Du er invitert til</text><text class="d05-t" x="20.00" y="166.00" font-size="36" font-weight="500" fill="#101010">class-of-1994.</text><text class="d05-t" x="20.00" y="228.00" font-size="15" font-weight="400" fill="#696969">IBE160, faglærer Bård</text><text class="d05-t" x="20.00" y="290.00" font-size="13" font-weight="400" fill="#696969">E-post</text><text class="d05-t" x="20.00" y="316.00" font-size="18" font-weight="500" fill="#101010">sara.lunde@stud.example.no</text><line x1="20.00" y1="328.00" x2="370.00" y2="328.00" stroke="#101010" stroke-width="1"/><text class="d05-t" x="20.00" y="366.00" font-size="13" font-weight="400" fill="#696969">Navn</text><text class="d05-t" x="20.00" y="392.00" font-size="18" font-weight="500" fill="#101010">Sara Lunde</text><line x1="20.00" y1="404.00" x2="370.00" y2="404.00" stroke="#101010" stroke-width="1"/><text class="d05-t" x="20.00" y="442.00" font-size="13" font-weight="400" fill="#696969">Passord</text><text class="d05-t" x="20.00" y="468.00" font-size="18" font-weight="400" fill="#696969">Minst 12 tegn</text><line x1="20.00" y1="480.00" x2="370.00" y2="480.00" stroke="#101010" stroke-width="1"/><rect x="20.00" y="532.00" width="350.00" height="56.00" fill="#101010"/><text class="d05-t" x="195.00" y="565.76" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Opprett konto</text><text class="d05-t" x="20.00" y="618.00" font-size="14" font-weight="400" fill="#696969">Invitasjonen er gyldig i 14 dager. Du får vite Rolle og spill</text><text class="d05-t" x="20.00" y="638.00" font-size="14" font-weight="400" fill="#696969">når klassen er fordelt.</text></g><g transform="translate(440.00 68.00) scale(0.95)"><rect x="0.00" y="0.00" width="390.00" height="844.00" fill="#FFFFFF" stroke="#C4C4C4" stroke-width="1" rx="30"/><text class="d05-t" x="20.00" y="62.00" font-size="15" font-weight="600" fill="#101010">Sara</text><text class="d05-t" x="370.00" y="62.00" font-size="15" font-weight="400" fill="#696969" text-anchor="end">Spill 17, Grossist</text><text class="d05-t" x="20.00" y="120.00" font-size="28" font-weight="500" fill="#101010" letter-spacing="-0.3">Spillet venter på deg</text><text class="d05-t" x="20.00" y="186.00" font-size="44" font-weight="500" fill="#101010" letter-spacing="-0.44">0</text><text class="d05-t" x="20.00" y="207.00" font-size="13" font-weight="400" fill="#696969">Lager</text><text class="d05-t" x="62.97" y="186.00" font-size="44" font-weight="400" fill="#101010">−</text><text class="d05-t" x="96.85" y="186.00" font-size="44" font-weight="500" fill="#101010" letter-spacing="-0.44">13</text><text class="d05-t" x="62.97" y="207.00" font-size="13" font-weight="400" fill="#696969">Restordre</text><text class="d05-t" x="155.20" y="186.00" font-size="44" font-weight="400" fill="#101010">+</text><text class="d05-t" x="189.08" y="186.00" font-size="44" font-weight="500" fill="#101010" letter-spacing="-0.44">16</text><text class="d05-t" x="155.20" y="207.00" font-size="13" font-weight="400" fill="#696969">På vei</text><text class="d05-t" x="247.42" y="186.00" font-size="44" font-weight="400" fill="#101010">=</text><text class="d05-t" x="281.30" y="186.00" font-size="44" font-weight="500" fill="#E2001A" letter-spacing="-0.44">3</text><text class="d05-t" x="247.42" y="207.00" font-size="13" font-weight="400" fill="#696969">Posisjon</text><rect x="20.00" y="240.00" width="350.00" height="52.00" fill="#101010"/><text class="d05-t" x="195.00" y="271.40" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Legg inn ordre, Uke 11</text><text class="d05-t" x="20.00" y="336.00" font-size="13" font-weight="400" fill="#696969">Setene</text><text class="d05-t" x="20.00" y="360.00" font-size="15" font-weight="400" fill="#101010">Detaljist, Ida</text><text class="d05-t" x="370.00" y="360.00" font-size="15" font-weight="400" fill="#101010" text-anchor="end">har bestilt</text><text class="d05-t" x="20.00" y="387.00" font-size="15" font-weight="600" fill="#101010">Grossist, Sara (deg)</text><text class="d05-t" x="370.00" y="387.00" font-size="15" font-weight="600" fill="#101010" text-anchor="end">venter på deg</text><text class="d05-t" x="20.00" y="414.00" font-size="15" font-weight="400" fill="#101010">Distributør, Mikkel</text><text class="d05-t" x="370.00" y="414.00" font-size="15" font-weight="400" fill="#101010" text-anchor="end">har bestilt</text><text class="d05-t" x="20.00" y="441.00" font-size="15" font-weight="400" fill="#101010">Fabrikk, Jonas</text><text class="d05-t" x="370.00" y="441.00" font-size="15" font-weight="400" fill="#101010" text-anchor="end">venter, 3 min</text><text class="d05-t" x="20.00" y="490.00" font-size="13" font-weight="400" fill="#696969">Stegene</text><text class="d05-t" x="20.00" y="514.00" font-size="15" font-weight="400" fill="#696969">1</text><text class="d05-t" x="44.00" y="514.00" font-size="15" font-weight="600" fill="#101010">Klassespill</text><text class="d05-t" x="370.00" y="514.00" font-size="15" font-weight="600" fill="#101010" text-anchor="end">pågår</text><text class="d05-t" x="20.00" y="541.00" font-size="15" font-weight="400" fill="#696969">2</text><text class="d05-t" x="44.00" y="541.00" font-size="15" font-weight="400" fill="#101010">Debrief</text><text class="d05-t" x="370.00" y="541.00" font-size="15" font-weight="400" fill="#696969" text-anchor="end">låst</text><text class="d05-t" x="20.00" y="568.00" font-size="15" font-weight="400" fill="#696969">3</text><text class="d05-t" x="44.00" y="568.00" font-size="15" font-weight="400" fill="#101010">Quiz</text><text class="d05-t" x="370.00" y="568.00" font-size="15" font-weight="400" fill="#696969" text-anchor="end">låst</text><text class="d05-t" x="20.00" y="595.00" font-size="15" font-weight="400" fill="#696969">4</text><text class="d05-t" x="44.00" y="595.00" font-size="15" font-weight="400" fill="#101010">Replay</text><text class="d05-t" x="370.00" y="595.00" font-size="15" font-weight="400" fill="#696969" text-anchor="end">låst</text><text class="d05-t" x="20.00" y="622.00" font-size="15" font-weight="400" fill="#696969">5</text><text class="d05-t" x="44.00" y="622.00" font-size="15" font-weight="400" fill="#101010">Individuell test</text><text class="d05-t" x="370.00" y="622.00" font-size="15" font-weight="400" fill="#696969" text-anchor="end">låst</text><text class="d05-t" x="20.00" y="649.00" font-size="15" font-weight="400" fill="#696969">6</text><text class="d05-t" x="44.00" y="649.00" font-size="15" font-weight="400" fill="#101010">Rapport</text><text class="d05-t" x="370.00" y="649.00" font-size="15" font-weight="400" fill="#696969" text-anchor="end">låst</text><text class="d05-t" x="20.00" y="698.00" font-size="13" font-weight="400" fill="#696969">Neste frist</text><text class="d05-t" x="370.00" y="698.00" font-size="13" font-weight="400" fill="#696969" text-anchor="end">Labtime</text><text class="d05-t" x="20.00" y="722.00" font-size="15" font-weight="500" fill="#101010">Spillfrist, ti. 8. des</text><text class="d05-t" x="370.00" y="722.00" font-size="15" font-weight="500" fill="#101010" text-anchor="end">to. 26. nov 14:15</text><text class="d05-t" x="370.00" y="744.00" font-size="15" font-weight="400" fill="#101010" text-anchor="end">Datalab A2</text></g><text class="d05-t" x="830.00" y="110.00" font-size="15" font-weight="600" fill="#101010">Hjem viser det</text><text class="d05-t" x="830.00" y="130.00" font-size="15" font-weight="600" fill="#101010">samme</text><text class="d05-t" x="830.00" y="150.00" font-size="15" font-weight="600" fill="#101010">regnestykket som</text><text class="d05-t" x="830.00" y="170.00" font-size="15" font-weight="600" fill="#101010">spillet.</text><text class="d05-t" x="830.00" y="200.00" font-size="14" font-weight="400" fill="#696969">Ingen ukeantall og</text><text class="d05-t" x="830.00" y="219.00" font-size="14" font-weight="400" fill="#696969">ingen framdrift for</text><text class="d05-t" x="830.00" y="238.00" font-size="14" font-weight="400" fill="#696969">selve spillet, bare</text><text class="d05-t" x="830.00" y="257.00" font-size="14" font-weight="400" fill="#696969">hvor langt Sara er i</text><text class="d05-t" x="830.00" y="276.00" font-size="14" font-weight="400" fill="#696969">de seks stegene.</text><text class="d05-t" x="830.00" y="340.00" font-size="14" font-weight="400" fill="#696969">Andre seter vises</text><text class="d05-t" x="830.00" y="359.00" font-size="14" font-weight="400" fill="#696969">som status, aldri</text><text class="d05-t" x="830.00" y="378.00" font-size="14" font-weight="400" fill="#696969">med tall.</text></svg>