<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" font-family="Mulish,Segoe UI,Helvetica,Arial,sans-serif"><title>Lag: Lag Klasse</title><desc>Faglærer lager Klasse: navn, emnekode, Canvas-fil, e-postkolonne, ugyldige rader, send Invitasjoner og status.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;700&amp;display=swap');.d09-t{font-family:'Mulish','Segoe UI',Helvetica,Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums;}.d09-u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;}.d09-h{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round;}</style><defs><pattern id="d09-02-skravur" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#9C9C9C" stroke-width="1"/></pattern></defs><rect id="d09-02-grunn" x="0" y="0" width="1440" height="1000" fill="#FFFFFF"/><text class="d09-t" x="78.0" y="92.0" font-size="40" font-weight="300" fill="#111111">Lag Klasse</text><text class="d09-t" x="80.0" y="160.0" font-size="14" font-weight="400" fill="#5C5C5C">Navn</text><text class="d09-t" x="80.0" y="188.0" font-size="19" font-weight="400" fill="#111111">class-of-1994</text><line x1="80.0" y1="200.0" x2="460.0" y2="200.0" stroke="#D4D4D4" stroke-width="1" fill="none"/><text class="d09-t" x="80.0" y="244.0" font-size="14" font-weight="400" fill="#5C5C5C">Emnekode</text><text class="d09-t" x="80.0" y="272.0" font-size="19" font-weight="400" fill="#111111">IBE160</text><line x1="80.0" y1="284.0" x2="460.0" y2="284.0" stroke="#D4D4D4" stroke-width="1" fill="none"/><text class="d09-t" x="80.0" y="328.0" font-size="14" font-weight="400" fill="#5C5C5C">Studentliste</text><text class="d09-t" x="80.0" y="356.0" font-size="19" font-weight="400" fill="#111111">class-of-1994.xlsx</text><line x1="80.0" y1="368.0" x2="460.0" y2="368.0" stroke="#D4D4D4" stroke-width="1" fill="none"/><text class="d09-t d09-u" x="460.0" y="356.0" font-size="14" font-weight="400" fill="#111111" text-anchor="end">Bytt fil</text><text class="d09-t" x="80.0" y="390.0" font-size="14" font-weight="400" fill="#5C5C5C">Canvas-eksport, 250 rader.</text><text class="d09-t" x="80.0" y="428.0" font-size="14" font-weight="400" fill="#5C5C5C">E-postkolonne</text><text class="d09-t" x="80.0" y="456.0" font-size="19" font-weight="400" fill="#111111">SIS Login ID</text><line x1="80.0" y1="468.0" x2="460.0" y2="468.0" stroke="#D4D4D4" stroke-width="1" fill="none"/><text class="d09-t d09-u" x="460.0" y="456.0" font-size="14" font-weight="400" fill="#111111" text-anchor="end">Velg annen</text><text class="d09-t" x="80.0" y="490.0" font-size="14" font-weight="400" fill="#5C5C5C">246 av 250 adresser er gyldige.</text><text class="d09-t" x="598.0" y="186.0" font-size="34" font-weight="300" fill="#111111">4 rader må rettes</text><text class="d09-t" x="600.0" y="218.0" font-size="16" font-weight="400" fill="#5C5C5C">De andre 246 er i orden.</text><text class="d09-t" x="600.0" y="266.0" font-size="13" font-weight="400" fill="#5C5C5C">Rad</text><text class="d09-t" x="660.0" y="266.0" font-size="13" font-weight="400" fill="#5C5C5C">Navn</text><text class="d09-t" x="790.0" y="266.0" font-size="13" font-weight="400" fill="#5C5C5C">Adresse i fila</text><text class="d09-t" x="1100.0" y="266.0" font-size="13" font-weight="400" fill="#5C5C5C">Feil</text><text class="d09-t" x="600.0" y="298.0" font-size="16" font-weight="700" fill="#111111">37</text><text class="d09-t" x="660.0" y="298.0" font-size="16" font-weight="400" fill="#111111">Nora Lien</text><text class="d09-t" x="790.0" y="298.0" font-size="16" font-weight="400" fill="#111111">nora.lien@student</text><text class="d09-t" x="1100.0" y="298.0" font-size="15" font-weight="400" fill="#DB3A12">Mangler domene</text><text class="d09-t d09-u" x="1300.0" y="298.0" font-size="15" font-weight="400" fill="#111111" text-anchor="end">Rett</text><text class="d09-t" x="600.0" y="338.0" font-size="16" font-weight="700" fill="#111111">88</text><text class="d09-t" x="660.0" y="338.0" font-size="16" font-weight="400" fill="#111111">Emil Berg</text><text class="d09-t" x="790.0" y="338.0" font-size="16" font-weight="400" fill="#111111">emil.berg.student.example.no</text><text class="d09-t" x="1100.0" y="338.0" font-size="15" font-weight="400" fill="#DB3A12">Mangler @</text><text class="d09-t d09-u" x="1300.0" y="338.0" font-size="15" font-weight="400" fill="#111111" text-anchor="end">Rett</text><text class="d09-t" x="600.0" y="378.0" font-size="16" font-weight="700" fill="#111111">141</text><text class="d09-t" x="660.0" y="378.0" font-size="16" font-weight="400" fill="#111111">Thea Moe</text><text class="d09-t" x="790.0" y="378.0" font-size="16" font-weight="400" fill="#111111">thea moe@student.example.no</text><text class="d09-t" x="1100.0" y="378.0" font-size="15" font-weight="400" fill="#DB3A12">Mellomrom i adressen</text><text class="d09-t d09-u" x="1300.0" y="378.0" font-size="15" font-weight="400" fill="#111111" text-anchor="end">Rett</text><text class="d09-t" x="600.0" y="418.0" font-size="16" font-weight="700" fill="#111111">203</text><text class="d09-t" x="660.0" y="418.0" font-size="16" font-weight="400" fill="#111111">Jakob Dahl</text><text class="d09-t" x="790.0" y="418.0" font-size="16" font-weight="400" fill="#111111">jakob.dahl@@student.example.no</text><text class="d09-t" x="1100.0" y="418.0" font-size="15" font-weight="400" fill="#DB3A12">To @</text><text class="d09-t d09-u" x="1300.0" y="418.0" font-size="15" font-weight="400" fill="#111111" text-anchor="end">Rett</text><rect x="600.0" y="474.0" width="330.0" height="58.0" fill="#111111" rx="2"/><text class="d09-t" x="765.0" y="508.9" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Send 246 Invitasjoner</text><text class="d09-t" x="954.0" y="500.0" font-size="14" font-weight="400" fill="#5C5C5C">Gyldig i 14 dager. Rettede rader kan sendes senere.</text><text class="d09-t" x="598.0" y="640.0" font-size="26" font-weight="300" fill="#111111">Status etter utsending</text><line x1="600.0" y1="686.0" x2="1321.5" y2="686.0" stroke="#111111" stroke-width="4" fill="none"/><line x1="1323.5" y1="686.0" x2="1327.6" y2="686.0" stroke="#5C5C5C" stroke-width="4" fill="none"/><line x1="1329.6" y1="686.0" x2="1358.0" y2="686.0" stroke="#D4D4D4" stroke-width="4" fill="none"/><text class="d09-t" x="600.0" y="722.0" font-size="16"><tspan font-weight="700" fill="#111111">238</tspan><tspan font-weight="400" fill="#5C5C5C"> registrert</tspan></text><text class="d09-t" x="770.0" y="722.0" font-size="16"><tspan font-weight="700" fill="#111111">2</tspan><tspan font-weight="400" fill="#5C5C5C"> manuelt registrert</tspan></text><text class="d09-t" x="1000.0" y="722.0" font-size="16"><tspan font-weight="700" fill="#111111">10</tspan><tspan font-weight="400" fill="#5C5C5C"> uregistrert</tspan></text><text class="d09-t d09-u" x="1360.0" y="722.0" font-size="15" font-weight="400" fill="#111111" text-anchor="end">Send påminnelse</text><text class="d09-t" x="80.0" y="952.0" font-size="13" font-weight="400" fill="#5C5C5C">Demodata</text></svg>