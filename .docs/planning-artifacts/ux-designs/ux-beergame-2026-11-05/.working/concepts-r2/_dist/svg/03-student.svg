<text class="d03-s" x="20.0" y="60.0" font-size="24" fill="#16233B" font-weight="600">Fase</text>
<text class="d03-k" x="20.0" y="118.0" font-size="16" fill="#4A5A72">Velkommen til</text>
<text class="d03-s" x="20.0" y="150.0" font-size="26" fill="#16233B" font-weight="600">class-of-1994, IBE160</text>
<text class="d03-k" x="20.0" y="186.0" font-size="16" fill="#16233B">Bård har invitert deg. Lag en konto, så får</text>
<text class="d03-k" x="20.0" y="209.0" font-size="16" fill="#16233B">du Sete i et Klassespill når øvelsen</text>
<text class="d03-k" x="20.0" y="232.0" font-size="16" fill="#16233B">starter.</text>
<text class="d03-k" x="20.0" y="268.0" font-size="14.5" fill="#16233B" font-weight="600">Navn</text>
<rect x="20.0" y="276.0" width="350.0" height="44.0" fill="#FFFFFF" stroke="#8494A8" stroke-width="1" rx="5"/>
<text class="d03-k" x="32.0" y="303.5" font-size="16" fill="#16233B">Sara Nilsen</text>
<text class="d03-k" x="20.0" y="348.0" font-size="14.5" fill="#16233B" font-weight="600">E-post fra Klasselisten</text>
<rect x="20.0" y="356.0" width="350.0" height="44.0" fill="#FFFFFF" stroke="#8494A8" stroke-width="1" rx="5"/>
<text class="d03-k" x="32.0" y="383.5" font-size="16" fill="#16233B">sara.nilsen@student.example</text>
<text class="d03-k" x="20.0" y="428.0" font-size="14.5" fill="#16233B" font-weight="600">Velg passord</text>
<rect x="20.0" y="436.0" width="350.0" height="44.0" fill="#FFFFFF" stroke="#8494A8" stroke-width="1" rx="5"/>
<text class="d03-k" x="32.0" y="463.5" font-size="16" fill="#16233B">•••••••••••</text>
<text class="d03-k" x="20.0" y="502.0" font-size="13.5" fill="#4A5A72">Minst 10 tegn.</text>
<rect x="20.0" y="526.0" width="350.0" height="56.0" fill="#14356F" rx="7"/>
<text class="d03-k" x="195.0" y="560.1" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">Opprett konto</text>
<text class="d03-s" x="20.0" y="620.0" font-size="18" fill="#16233B" font-weight="600">Slik går øvelsen</text>
<text class="d03-k" x="20.0" y="646.0" font-size="15.5" fill="#16233B">Du driver ett ledd i en kjede og tar én</text>
<text class="d03-k" x="20.0" y="668.0" font-size="15.5" fill="#16233B">beslutning hver Uke. Spillet går over flere</text>
<text class="d03-k" x="20.0" y="690.0" font-size="15.5" fill="#16233B">dager, på din egen telefon.</text>
<text class="d03-k" x="20.0" y="722.0" font-size="15.5" fill="#16233B" font-weight="600">Starter ti. 24. nov 2026.</text>
<text class="d03-k" x="20.0" y="746.0" font-size="15.5" fill="#14356F" font-weight="600">Har du konto? Logg inn</text>
