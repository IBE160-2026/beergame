<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="'Karla','Helvetica Neue',Arial,sans-serif">
<title>Fase: registrering og hjem for student</title>
<desc>To telefoner: registrering fra Invitasjon, og hjem under spill med faseplan, seter, seks steg, neste frist og Labtimer.</desc>
<style>@import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@400;500;600;700&amp;family=Karla:wght@400;500;600;700&amp;display=swap');.d03-k{font-family:'Karla','Helvetica Neue',Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums}.d03-s{font-family:'STIX Two Text','Times New Roman',serif;font-variant-numeric:lining-nums tabular-nums}</style>
