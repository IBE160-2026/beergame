<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" id="d06-student-hjem-root" class="d06-root" font-family="'Public Sans','Franklin Gothic Medium',Arial,sans-serif"><title>Matrise: student på mobil</title><desc>To telefoner: registrering fra Invitasjon, og hjem under spill med seter, seks steg, frist og Labtimer.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap');.d06-root{font-variant-numeric:tabular-nums}.d06-p{font-variant-numeric:proportional-nums}.d06-r{font-weight:400}.d06-m{font-weight:500}.d06-s{font-weight:600}.d06-b{font-weight:700}</style><rect x="0" y="0" width="1000" height="900" fill="#F1F4F5"/><text class="d06-s" x="68" y="34" font-size="15" fill="#21272B">Registrering fra Invitasjon</text><text class="d06-s" x="558" y="34" font-size="15" fill="#21272B">Hjem under spill</text><g transform="translate(68 50) scale(0.96)"><rect x="0" y="0" width="390" height="844" fill="#FBFCFC" stroke="#98A2A9" stroke-width="1.2" rx="30"/><text class="d06-b" x="18" y="66" font-size="15" fill="#21272B">Matrise</text><text class="d06-b d06-p" x="18" y="116" font-size="28" fill="#21272B">Du er invitert til IBE160</text><text class="d06-r" x="18" y="149.36" font-size="15" fill="#4C565E">Faglærer Bård har lagt deg til i Klassen</text><text class="d06-r" x="18" y="170.66" font-size="15" fill="#4C565E">class-of-1994. Invitasjonen er gyldig i 14 dager.</text><text class="d06-m" x="18" y="211.96" font-size="13" fill="#4C565E">Navn</text><rect x="18" y="218.96" width="354" height="48" fill="#FFFFFF" stroke="#98A2A9" stroke-width="1" rx="3"/><text class="d06-r" x="30" y="248.36" font-size="15" fill="#21272B">Sara Berg</text><text class="d06-m" x="18" y="293.96" font-size="13" fill="#4C565E">E-post, fra Klasselista</text><rect x="18" y="300.96" width="354" height="48" fill="#F1F4F5" stroke="#98A2A9" stroke-width="1" rx="3"/><text class="d06-r" x="30" y="330" font-size="14" fill="#21272B">sara.berg@student.example.no</text><text class="d06-m" x="18" y="375.96" font-size="13" fill="#4C565E">Velg passord</text><rect x="18" y="382.96" width="354" height="48" fill="#FFFFFF" stroke="#98A2A9" stroke-width="1" rx="3"/><text class="d06-r" x="30" y="412.36" font-size="15" fill="#21272B">••••••••••</text><rect x="18" y="455.96" width="354" height="56" fill="#21272B" rx="4"/><text class="d06-s" x="195" y="489.96" font-size="17" fill="#FFFFFF" text-anchor="middle">Opprett konto</text><text class="d06-r" x="18" y="537.96" font-size="14" fill="#4C565E">Du trenger konto for å spille. Du spiller på denne</text><text class="d06-r" x="18" y="557.84" font-size="14" fill="#4C565E">telefonen, og du kan fortsette fra en annen.</text></g><g transform="translate(558 50) scale(0.96)"><rect x="0" y="0" width="390" height="844" fill="#FBFCFC" stroke="#98A2A9" stroke-width="1.2" rx="30"/><text class="d06-b d06-p" x="18" y="58" font-size="26" fill="#21272B">Sara</text><text class="d06-m" x="372" y="58" font-size="15" fill="#21272B" text-anchor="end">Spill 17, Grossist</text><rect x="18" y="76" width="354" height="92" fill="#21272B" rx="4"/><text class="d06-s" x="32" y="106" font-size="18" fill="#FFFFFF">Spillet venter på deg</text><text class="d06-r" x="32" y="128" font-size="14" fill="#FFFFFF">Uke 11. Ida og Mikkel har bestilt.</text><text class="d06-s" x="32" y="152" font-size="15" fill="#FFFFFF">Gå til spillet</text><line x1="32" y1="157" x2="119.3" y2="157" stroke="#FFFFFF" stroke-width="1"/><text class="d06-b" x="18" y="200" font-size="15" fill="#21272B">Setene</text><circle cx="24" cy="221" r="5" fill="#21272B"/><text class="d06-r" x="38" y="226" font-size="14" fill="#21272B">Ida, Detaljist</text><text class="d06-r" x="372" y="226" font-size="14" fill="#4C565E" text-anchor="end">har bestilt</text><circle cx="24" cy="247" r="4.5" fill="#FBFCFC" stroke="#21272B" stroke-width="1.4"/><text class="d06-m" x="38" y="252" font-size="14" fill="#21272B">Sara (deg), Grossist</text><text class="d06-s" x="372" y="252" font-size="14" fill="#21272B" text-anchor="end">venter</text><circle cx="24" cy="273" r="5" fill="#21272B"/><text class="d06-r" x="38" y="278" font-size="14" fill="#21272B">Mikkel, Distributør</text><text class="d06-r" x="372" y="278" font-size="14" fill="#4C565E" text-anchor="end">har bestilt</text><circle cx="24" cy="299" r="4.5" fill="#FBFCFC" stroke="#21272B" stroke-width="1.4"/><text class="d06-m" x="38" y="304" font-size="14" fill="#21272B">Jonas, Fabrikk</text><text class="d06-s" x="372" y="304" font-size="14" fill="#21272B" text-anchor="end">venter, 3 min</text><text class="d06-b" x="18" y="342" font-size="15" fill="#21272B">Stegene</text><rect x="18" y="354" width="354" height="28" fill="#596269"/><text class="d06-s" x="30" y="373" font-size="14" fill="#FFFFFF">Klassespill</text><text class="d06-m" x="360" y="373" font-size="13" fill="#FFFFFF" text-anchor="end">pågår</text><rect x="18" y="384" width="354" height="28" fill="#F1F4F5"/><text class="d06-r" x="30" y="403" font-size="14" fill="#4C565E">Debrief</text><text class="d06-r" x="360" y="403" font-size="13" fill="#4C565E" text-anchor="end">ikke åpnet</text><rect x="18" y="414" width="354" height="28" fill="#F1F4F5"/><text class="d06-r" x="30" y="433" font-size="14" fill="#4C565E">Quiz</text><text class="d06-r" x="360" y="433" font-size="13" fill="#4C565E" text-anchor="end">ikke åpnet</text><rect x="18" y="444" width="354" height="28" fill="#F1F4F5"/><text class="d06-r" x="30" y="463" font-size="14" fill="#4C565E">Replay</text><text class="d06-r" x="360" y="463" font-size="13" fill="#4C565E" text-anchor="end">ikke åpnet</text><rect x="18" y="474" width="354" height="28" fill="#F1F4F5"/><text class="d06-r" x="30" y="493" font-size="14" fill="#4C565E">Individuell test</text><text class="d06-r" x="360" y="493" font-size="13" fill="#4C565E" text-anchor="end">ikke åpnet</text><rect x="18" y="504" width="354" height="28" fill="#F1F4F5"/><text class="d06-r" x="30" y="523" font-size="14" fill="#4C565E">Rapport</text><text class="d06-r" x="360" y="523" font-size="13" fill="#4C565E" text-anchor="end">ikke åpnet</text><text class="d06-r" x="18" y="556" font-size="14" fill="#4C565E">Neste frist</text><text class="d06-s" x="372" y="556" font-size="14" fill="#21272B" text-anchor="end">Spillfrist ti. 8. des</text><line x1="18" y1="566" x2="372" y2="566" stroke="#D2D8DC" stroke-width="1"/><text class="d06-r" x="18" y="588" font-size="14" fill="#4C565E">Labtimer, Datalab A2</text><text class="d06-s" x="372" y="588" font-size="14" fill="#21272B" text-anchor="end">to. 26. nov 14:15</text><text class="d06-r" x="372" y="608" font-size="14" fill="#21272B" text-anchor="end">ma. 30. nov 10:15</text><text class="d06-r" x="372" y="628" font-size="14" fill="#21272B" text-anchor="end">to. 3. des 14:15</text><text class="d06-r" x="18" y="824" font-size="13" fill="#4C565E">Demodata</text></g></svg>