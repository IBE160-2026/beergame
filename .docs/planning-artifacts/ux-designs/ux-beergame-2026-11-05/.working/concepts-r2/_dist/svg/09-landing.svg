<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" font-family="Mulish,Segoe UI,Helvetica,Arial,sans-serif"><title>Lag: For faglærere</title><desc>Landingsside for faglærere: en stor graf for ett sete, og starten av lærerens oversikt.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;700&amp;display=swap');.d09-t{font-family:'Mulish','Segoe UI',Helvetica,Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums;}.d09-u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;}.d09-h{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round;}</style><defs><pattern id="d09-01-skravur" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#9C9C9C" stroke-width="1"/></pattern></defs><rect id="d09-01-grunn" x="0" y="0" width="1440" height="1200" fill="#FFFFFF"/><text class="d09-t" x="80.0" y="66.0" font-size="22" font-weight="700" fill="#111111">Lag</text><text class="d09-t" x="76.0" y="160.0" font-size="58" font-weight="300" fill="#111111">En forsyningskjedeøvelse for hele kullet,</text><text class="d09-t" x="76.0" y="230.0" font-size="58" font-weight="300" fill="#111111">fra Invitasjon til PDF-rapport.</text><text class="d09-t" x="80.0" y="304.0" font-size="20" font-weight="400" fill="#5C5C5C">Studentene spiller hvert sitt ledd på mobilen, og ser én graf som vokser</text><text class="d09-t" x="80.0" y="334.0" font-size="20" font-weight="400" fill="#5C5C5C">med spillet. Nye begreper kommer når spillet gjør dem relevante. Du ser</text><text class="d09-t" x="80.0" y="364.0" font-size="20" font-weight="400" fill="#5C5C5C">alle spillene på én skjerm.</text><rect x="80.0" y="416.0" width="240.0" height="58.0" fill="#111111" rx="2"/><text class="d09-t" x="200.0" y="450.9" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Be om lærertilgang</text><text class="d09-t d09-u" x="348.0" y="452.0" font-size="17" font-weight="400" fill="#111111">Logg inn</text><line x1="120.0" y1="848.9" x2="1220.0" y2="848.9" stroke="#EDEDED" stroke-width="1" fill="none"/><text class="d09-t" x="112.0" y="853.8" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="end">−40</text><line x1="120.0" y1="645.9" x2="1220.0" y2="645.9" stroke="#EDEDED" stroke-width="1" fill="none"/><text class="d09-t" x="112.0" y="650.8" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="end">40</text><line x1="120.0" y1="544.4" x2="1220.0" y2="544.4" stroke="#EDEDED" stroke-width="1" fill="none"/><text class="d09-t" x="112.0" y="549.3" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="end">80</text><line x1="120.0" y1="747.4" x2="1220.0" y2="747.4" stroke="#9C9C9C" stroke-width="1" fill="none"/><text class="d09-t" x="112.0" y="752.3" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="end">0</text><text class="d09-t" x="120.0" y="876.0" font-size="14" font-weight="400" fill="#5C5C5C">Uke 1</text><text class="d09-t" x="480.3" y="876.0" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">10</text><text class="d09-t" x="859.7" y="876.0" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">20</text><line x1="1220.0" y1="514.0" x2="1220.0" y2="858.0" stroke="#DB3A12" stroke-width="1" fill="none"/><text class="d09-t" x="1220.0" y="876.0" font-size="14" font-weight="700" fill="#DB3A12" text-anchor="middle">nå</text><rect x="347.6" y="732.2" width="37.9" height="5.1" fill="#EDEDED" rx="0"/><rect x="385.5" y="722.1" width="37.9" height="15.2" fill="#EDEDED" rx="0"/><rect x="423.4" y="719.5" width="37.9" height="17.8" fill="#EDEDED" rx="0"/><rect x="461.4" y="722.1" width="37.9" height="15.2" fill="#EDEDED" rx="0"/><rect x="499.3" y="727.1" width="37.9" height="10.1" fill="#EDEDED" rx="0"/><rect x="537.2" y="719.5" width="37.9" height="17.8" fill="#EDEDED" rx="0"/><rect x="575.2" y="722.1" width="37.9" height="15.2" fill="#EDEDED" rx="0"/><rect