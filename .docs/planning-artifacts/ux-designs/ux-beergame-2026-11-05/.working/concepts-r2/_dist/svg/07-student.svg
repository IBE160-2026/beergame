<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Commissioner, 'Segoe UI', system-ui, sans-serif"><title>Horisont: Sara på mobil</title><desc>To telefoner: registrering fra Invitasjon, og hjem under spill med setene, seks steg, neste frist, Labtimer og «spillet venter på deg». Demodata.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Commissioner:wght@300..700&amp;display=swap');.d07-t{font-family:'Commissioner','Segoe UI',system-ui,sans-serif}.d07-n{font-family:'Commissioner','Segoe UI',system-ui,sans-serif;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1,'lnum' 1}</style><rect x="0" y="0" width="1000" height="900" fill="#192025"/><text x="90.0" y="42.0" font-size="16" font-weight="400" fill="#B7C3C5" class="d07-t">Registrering fra Invitasjon</text><text x="530.0" y="42.0" font-size="16" font-weight="400" fill="#B7C3C5" class="d07-t">Hjem under spill</text><g transform="translate(90 60) scale(0.97)"><rect x="0.0" y="0.0" width="390.0" height="844.0" fill="#1F272C" rx="26" stroke="#3D4A52" stroke-width="1.2"/><text x="20.0" y="56.0" font-size="18" font-weight="500" fill="#EAEFEE" class="d07-t">Horisont</text><text x="20.0" y="118.0" font-size="15" font-weight="400" fill="#B7C3C5" class="d07-t">Du er invitert til</text><text x="20.0" y="150.0" font-size="24" font-weight="400" fill="#EAEFEE" class="d07-t">IBE160, class-of-1994</text><text x="20.0" y="176.0" font-size="14" font-weight="400" fill="#B7C3C5" class="d07-t">Faglærer Bård</text><text x="20.0" y="226.0" font-size="14" font-weight="400" fill="#B7C3C5" class="d07-t">Navn</text><rect x="20.0" y="234.0" width="350.0" height="48.0" fill="#2A343A" rx="4"/><text x="34.0" y="263.0" font-size="15" font-weight="400" fill="#EAEFEE" class="d07-t">Sara Nilsen</text><text x="20.0" y="306.0" font-size="14" font-weight="400" fill="#B7C3C5" class="d07-t">E-post</text><rect x="20.0" y="314.0" width="350.0" height="48.0" fill="#2A343A" rx="4"/><text x="34.0" y="343.0" font-size="15" font-weight="400" fill="#EAEFEE" class="d07-t">sara.nilsen@uia.example</text><text x="20.0" y="386.0" font-size="14" font-weight="400" fill="#B7C3C5" class="d07-t">Passord</text><rect x="20.0" y="394.0" width="350.0" height="48.0" fill="#2A343A" rx="4"/><text x="34.0" y="423.0" font-size="15" font-weight="400" fill="#EAEFEE" class="d07-t">••••••••••</text><text x="20.0" y="480.0" font-size="15" font-weight="400" fill="#B7C3C5" class="d07-t">Du spiller i en gruppe på fire. Du får Rolle og</text><text x="20.0" y="501.0" font-size="15" font-weight="400" fill="#B7C3C5" class="d07-t">spill når faglæreren har fordelt klassen.</text><rect x="20.0" y="536.0" width="350.0" height="52.0" fill="#EAEFEE" rx="6"/><text x="195.0" y="567.4" font-size="15" font-weight="600" fill="#1F272C" class="d07-t" text-anchor="middle">Registrer meg</text><text x="195.0" y="616.0" font-size="13" font-weight="400" fill="#98A7AA" class="d07-t" text-anchor="middle">Invitasjonen er gyldig i 14 dager</text></g><g transform="translate(530 60) scale(0.97)"><rect x="0.0" y="0.0" width="390.0" height="844.0" fill="#1F272C" rx="26" stroke="#3D4A52" stroke-width="1.2"/><text x="20.0" y="46.0" font-size="26" font-weight="400" fill="#EAEFEE" class="d07-t">Spill 17</text><text x="370.0" y="46.0" font-size="15" font-weight="500" fill="#EAEFEE" class="d07-t" text-anchor="end">Grossist</text><text x="20.0" y="74.0" font-size="13" font-weight="400" fill="#B7C3C5" class="d07-t">Detaljist</text><text x="96.0" y="74.0" font-size="13" font-weight="400" fill="#EAEFEE" class="d07-t">Ida</text><text x="200.0" y="74.0" font-size="13" font-weight="400" fill="#B7C3C5" class="d07-t">Grossist</text><text x="276.0" y="74.0" font-size="13" font-weight="500" fill="#EAEFEE" class="d07-t">Sara, deg</text><text x="20.0" y="98.0" font-size="13" font-weight="400" fill="#B7C3C5" class="d07-t">Distributør</text><text x="96.0" y="98.0" font-size="13" font-weight="400" fill="#EAEFEE" class="d07-t">Mikkel</text><text x="200.0" y="98.0" font-size="13" font-weight="400" fill="#B7C3C5" class="d07-t">Fabrikk</text><text x="276.0" y="98.0" font-size="13" font-weight="400" fill="#EAEFEE" class="d07-t">Jonas</text><rect x="20.0" y="132.0" width="350.0" height="170.0" fill="#232C32" rx="8" stroke="#3D4A52" stroke-width="1"/><text x="34.0" y="164.0" font-size="19" font-weight="500" fill="#EAEFEE" class="d07-t">Spillet venter på deg</text><text x="356.0" y="164.0" font-size="15" font-weight="400" fill="#B7C3C5" class="d07-t" text-anchor="end">Uke 11</text><rect x="34.0" y="178.0" width="322.0" height="54.0" fill="#2A343A"/><path d="M34.0 232.0L34.0 215.8L66.2 215.8L98.4 215.8L130.6 215.8L162.8 215.8L195.0 215.8L227.2 218.5L259.4 226.6L277.8 232.0L291.6 232.0L323.8 232.0L356.0 232.0L356.0 232.0Z" fill="#3A928C"/><path d="M34.0 178.0L34.0 178.0L66.2 178.0L98.4 178.0L130.6 178.0L162.8 178.0L195.0 178.0L227.2 178.0L259.4 178.0L277.8 178.0L291.6 182.1L323.8 190.2L356.0 195.6L356.0 178.0Z" fill="#B26E3E"/><rect x="34.0" y="244.0" width="322.0" height="44.0" fill="#EAEFEE" rx="6"/><text x="195.0" y="271.4" font-size="15" font-weight="600" fill="#1F272C" class="d07-t" text-anchor="middle">Bestill for Uke 11</text><text x="20.0" y="336.0" font-size="15" font-weight="400" fill="#B7C3C5" class="d07-t">Dine seks steg</text><circle cx="28" cy="355" r="5" fill="#EAEFEE" stroke="#EAEFEE" stroke-width="1.2"/><line x1="28.0" y1="362.0" x2="28.0" y2="386.0" stroke="#3D4A52" stroke-width="1"/><text x="46.0" y="360.0" font-size="15" font-weight="500" fill="#EAEFEE" class="d07-t">Klassespill</text><text x="370.0" y="360.0" font-size="13" font-weight="400" fill="#EAEFEE" class="d07-t" text-anchor="end">pågår</text><circle cx="28" cy="392" r="4" fill="none" stroke="#93A3AC" stroke-width="1.2"/><line x1="28.0" y1="399.0" x2="28.0" y2="423.0" stroke="#3D4A52" stroke-width="1"/><text x="46.0" y="397.0" font-size="15" font-weight="400" fill="#B7C3C5" class="d07-t">Debrief</text><text x="370.0" y="397.0" font-size="13" font-weight="400" fill="#98A7AA" class="d07-t" text-anchor="end">etter spillet</text><circle cx="28" cy="429" r="4" fill="none" stroke="#93A3AC" stroke-width="1.2"/><line x1="28.0" y1="436.0" x2="28.0" y2="460.0" stroke="#3D4A52" stroke-width="1"/><text x="46.0" y="434.0" font-size="15" font-weight="400" fill="#B7C3C5" class="d07-t">Quiz</text><text x="370.0" y="434.0" font-size="13" font-weight="400" fill="#98A7AA" class="d07-t" text-anchor="end">etter Debrief</text><circle cx="28" cy="466" r="4" fill="none" stroke="#93A3AC" stroke-width="1.2"/><line x1="28.0" y1="473.0" x2="28.0" y2="497.0" stroke="#3D4A52" stroke-width="1"/><text x="46.0" y="471.0" font-size="15" font-weight="400" fill="#B7C3C5" class="d07-t">Replay</text><text x="370.0" y="471.0" font-size="13" font-weight="400" fill="#98A7AA" class="d07-t" text-anchor="end">etter quiz</text><circle cx="28" cy="503" r="4" fill="none" stroke="#93A3AC" stroke-width="1.2"/><line x1="28.0" y1="510.0" x2="28.0" y2="534.0" stroke="#3D4A52" stroke-width="1"/><text x="46.0" y="508.0" font-size="15" font-weight="400" fill="#B7C3C5" class="d07-t">Individuell test</text><text x="370.0" y="508.0" font-size="13" font-weight="400" fill="#98A7AA" class="d07-t" text-anchor="end">frist fr. 18. des</text><circle cx="28" cy="540" r="4" fill="none" stroke="#93A3AC" stroke-width="1.2"/><text x="46.0" y="545.0" font-size="15" font-weight="400" fill="#B7C3C5" class="d07-t">Rapport</text><text x="370.0" y="545.0" font-size="13" font-weight="400" fill="#98A7AA" class="d07-t" text-anchor="end">PDF når alt er ferdig</text><line x1="20.0" y1="576.0" x2="370.0" y2="576.0" stroke="#3D4A52" stroke-width="1"/><text x="20.0" y="600.0" font-size="15" font-weight="400" fill="#B7C3C5" class="d07-t">Neste frist</text><text x="370.0" y="600.0" font-size="15" font-weight="500" fill="#EAEFEE" class="d07-t" text-anchor="end">Spillfrist ti. 8. des</text><text x="20.0" y="632.0" font-size="15" font-weight="400" fill="#B7C3C5" class="d07-t">Labtime</text><text x="370.0" y="632.0" font-size="15" font-weight="500" fill="#EAEFEE" class="d07-n" text-anchor="end">to. 26. nov 14:15</text><text x="370.0" y="654.0" font-size="13" font-weight="400" fill="#B7C3C5" class="d07-t" text-anchor="end">Datalab A2</text><text x="20.0" y="654.0" font-size="13" font-weight="400" fill="#98A7AA" class="d07-t">Også ma. 30. nov, to. 3. des, ma. 7. des</text><text x="20.0" y="820.0" font-size="13" font-weight="400" fill="#98A7AA" class="d07-t">Demodata</text></g></svg>