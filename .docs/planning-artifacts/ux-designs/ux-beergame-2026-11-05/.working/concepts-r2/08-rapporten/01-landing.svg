<text x="64.0" y="986.0" class="d08-s" font-size="36" fill="#12302B" font-weight="500">Alle spillene på én skjerm</text>
<text x="64.0" y="1026.0" class="d08-s" font-size="18" fill="#12302B">KI-spillere fyller tomme seter, så ett fravær ikke stopper</text>
<text x="64.0" y="1053.0" class="d08-s" font-size="18" fill="#12302B">gruppa og ingen spill blir stående uferdig. Studentene spiller</text>
<text x="64.0" y="1080.0" class="d08-s" font-size="18" fill="#12302B">på mobil, på norsk. Studentlisten kommer fra Canvas-eksport.</text>
