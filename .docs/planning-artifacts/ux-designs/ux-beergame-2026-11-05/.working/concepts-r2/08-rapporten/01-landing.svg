<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" font-family="'Spectral','Iowan Old Style',Georgia,serif" id="d08-landing-root" role="img" aria-labelledby="d08-landing-title d08-landing-desc"><title id="d08-landing-title">Rapport: landingsside for faglærere</title><desc id="d08-landing-desc">En kommentert graf fra ett sete bærer siden. Primærhandling Be om lærertilgang, deretter lærerens oversikt.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&amp;family=Libre+Franklin:wght@400;500;600&amp;display=swap');.d08-s{font-family:'Spectral','Iowan Old Style',Georgia,serif;font-feature-settings:'lnum' 1,'kern' 1}.d08-f{font-family:'Libre Franklin','Helvetica Neue',Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums}.d08-p{font-family:'Libre Franklin','Helvetica Neue',Arial,sans-serif;font-variant-numeric:lining-nums proportional-nums}</style><rect x="0.0" y="0.0" width="1440.0" height="1200.0" fill="#F5F8F4"/>
<text x="64.0" y="56.0" class="d08-s" font-size="26" fill="#12302B" font-weight="500">Rapport</text>
<text x="1376.0" y="54.0" class="d08-f" font-size="15" fill="#12302B" font-weight="500" text-anchor="end">Logg inn</text>
<text x="64.0" y="150.0" class="d08-s" font-size="62" fill="#12302B" font-weight="500">Øvelsen i forsyningskjeder,</text>
<text x="64.0" y="222.0" class="d08-s" font-size="62" fill="#12302B" font-weight="500">fra Invitasjon til rapport</text>
<text x="64.0" y="278.0" class="d08-s" font-size="21" fill="#43605A">Fire studenter, fire ledd, ett tall i uka. Rapport kjører hele øvelsen for klasser på rundt</text>
<text x="64.0" y="309.0" class="d08-s" font-size="21" fill="#43605A">250, og hver student sitter igjen med en PDF-rapport om sitt eget spill.</text>
