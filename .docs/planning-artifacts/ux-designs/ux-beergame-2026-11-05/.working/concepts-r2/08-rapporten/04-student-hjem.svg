<rect x="20.0" y="492.0" width="350.0" height="50.0" fill="#E2E9E3" rx="3"/>
<text x="32.0" y="523.0" class="d08-f" font-size="15" fill="#12302B">••••••••••</text>
<rect x="20.0" y="572.0" width="350.0" height="58.0" fill="#12302B" rx="4"/>
<text x="195.0" y="607.0" class="d08-f" font-size="17" fill="#FBFCFA" font-weight="500" text-anchor="middle">Opprett konto</text>
<text x="20.0" y="660.0" class="d08-f" font-size="14" fill="#43605A">E-posten kommer fra klasselisten. Invitasjonen er</text>
<text x="20.0" y="680.0" class="d08-f" font-size="14" fill="#43605A">gyldig i 14 dager.</text>
<text x="20.0" y="718.0" class="d08-f" font-size="14" fill="#43605A">Du får vite hvem som leser svarene dine før du skriver</text>
<text x="20.0" y="738.0" class="d08-f" font-size="14" fill="#43605A">dem.</text>
