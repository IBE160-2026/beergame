<g transform="translate(60.0 28.0)">
<rect x="0.0" y="0.0" width="390.0" height="844.0" fill="#F5F8F4" rx="30" stroke="#AEBDB3" stroke-width="1"/>
<text x="20.0" y="54.0" class="d08-s" font-size="22" fill="#12302B" font-weight="500">Rapport</text>
<text x="20.0" y="112.0" class="d08-s" font-size="26" fill="#12302B" font-weight="500">Du er invitert til</text>
<text x="20.0" y="146.0" class="d08-s" font-size="26" fill="#12302B" font-weight="500">IBE160</text>
<text x="20.0" y="186.0" class="d08-s" font-size="17" fill="#12302B">Faglærer Bård har invitert deg til en øvelse i</text>
<text x="20.0" y="211.0" class="d08-s" font-size="17" fill="#12302B">forsyningskjeder. Dere spiller i grupper på fire,</text>
<text x="20.0" y="236.0" class="d08-s" font-size="17" fill="#12302B">på tiden dere selv velger.</text>
<text x="20.0" y="310.0" class="d08-f" font-size="14" fill="#12302B" font-weight="500">Navn</text>
<rect x="20.0" y="320.0" width="350.0" height="50.0" fill="#E2E9E3" rx="3"/>
