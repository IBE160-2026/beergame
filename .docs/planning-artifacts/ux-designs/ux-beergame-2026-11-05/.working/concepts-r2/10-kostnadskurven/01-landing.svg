<svg xmlns="http://www.w3.org/2000/svg" id="d10-landing-root" viewBox="0 0 1440 1200" font-family="'Alegreya Sans','Gill Sans','Trebuchet MS',Verdana,sans-serif"><title>Kurve: landingsside for faglærere</title><desc>Første skjermbilde med ett setes V-diagram, og starten på seksjonen om lærerens oversikt.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&amp;family=Alegreya+Sans:wght@400;500;700&amp;display=swap');
.d10-r{font-family:'Alegreya',Georgia,'Times New Roman',serif;font-variant-numeric:lining-nums proportional-nums}
.d10-s{font-family:'Alegreya Sans','Gill Sans','Trebuchet MS',Verdana,sans-serif;font-variant-numeric:lining-nums proportional-nums}
.d10-n{font-variant-numeric:lining-nums tabular-nums}</style><rect x="0.0" y="0.0" width="1440.0" height="1200.0" fill="#EEF2F6"/><text x="90.0" y="52.0" class="d10-r" font-size="28" fill="#13294B" font-weight="700">Kurve</text><text x="1350.0" y="50.0" class="d10-s" font-size="16" fill="#13294B" font-weight="500" text-anchor="end">Logg inn</text><line x1="90.0" y1="72.0" x2="1350.0" y2="72.0" stroke="#E1E6ED" stroke-width="1"/><text x="90.0" y="164.0" class="d10-r" font-size="50" fill="#13294B" font-weight="700">Hele øvelsen om</text><text x="90.0" y="224.0" class="d10-r" font-size="50" fill="#13294B" font-weight="700">forsyningskjeder, fra</text><text x="90.0" y="284.0" class="d10-r" font-size="50" fill="#13294B" font-weight="700">invitasjon til PDF-rapport</text><text x="90.0" y="354.0" class="d10-s" font-size="20" fill="#44546E">Fire studenter styrer hvert sitt ledd i kjeden, med ett heltall</text><text x="90.0" y="383.0" class="d10-s" font-size="20" fill="#44546E">i uka. Systemet regner, og grafen viser hva uka kostet. Du</text><text x="90.0" y="412.0" class="d10-s" font-size="20" fill="#44546E">følger alle spillene på én skjerm.</text><rect x="90.0" y="478.0" width="220.0" height="56.0" fill="#13294B" rx="6"/><text x="200.0" y="512.1" class="d10-s" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">Be om lærertilgang</text><rect x="322.0" y="478.0" width="120.0" height="56.0" fill="#FFFFFF" stroke="#13294B" stroke-width="1.2" rx="6"/><text x="382.0" y="512.1" class="d10-s" font-size="18" fill="#13294B" font-weight="500" text-anchor="middle">Logg inn</text><line x1="680.0" y1="457.5" x2="1350.0" y2="457.5" stroke="#E1E6ED" stroke-width="1"/><text x="680.0" y="453.5" class="d10-s d10-n" font-size="15" fill="#5F6F88">10 kr</text><line x1="680.0" y1="345.0" x2="1350.0" y2="345.0" stroke="#E1E6ED" stroke-width="1"/><text x="680.0" y="341.0" class="d10-s d10-n" font-size="15" fill="#5F6F88">20 kr</text><line x1="680.0" y1="232.5" x2="1350.0" y2="232.5" stroke="#E1E6ED" stroke-width="1"/><text x="680.0" y="228.5" class="d10-s d10-n" font-size="15" fill="#5F6F88">30 kr</text><line x1="680.0" y1="570.0" x2="1350.0" y2="570.0" stroke="#C5CEDA" stroke-width="1"/><line x1="680.0" y1="570.0" x2="680.0" y2="574.0" stroke="#C5CEDA" stroke-width="1"/><text x="680.0" y="590.0" class="d10-s d10-n" font-size="15" fill="#44546E">−40</text><line x1="847.5" y1="570.0" x2="847.5" y2="574.0" stroke="#C5CEDA" stroke-width="1"/><text x="847.5" y="590.0" class="d10-s d10-n" font-size="15" fill="#44546E" text-anchor="middle">−20</text><line x1="1015.0" y1="570.0" x2="1015.0" y2="574.0" stroke="#C5CEDA" stroke-width="1"/><text x="1015.0" y="590.0" class="d10-s d10-n" font-size="15" fill="#44546E" text-anchor="middle">0</text><line x1="1182.5" y1="570.0" x2="1182.5" y2="574.0" stroke="#C5CEDA" stroke-width="1"/><text x="1182.5" y="590.0" class="d10-s d10-n" font-size="15" fill="#44546E" text-anchor="middle">+20</text><line x1="1350.0" y1="570.0" x2="1350.0" y2="574.0" stroke="#C5CEDA" stroke-width="1"/><text x="1350.0" y="590.0" class="d10-s d10-n" font-size="15" fill="#44546E" text-anchor="end">+40</text><text x="680.0" y="112.0" class="d10-s" font-size="15" fill="#44546E">Kroner denne uka</text><text x="1015.0" y="610.0" class="d10-s" font-size="15" fill="#44546E" text-anchor="middle">Netto lager, enheter</text><polyline points="1015.0,570.0 680.0,120.0" fill="none" stroke="#B4711A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1015.0,570.0 1350.0,345.0" fill="none" stroke="#1C76B8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1115.5" cy="502.5" r="3.2" fill="#13294B" stroke="#FFFFFF" stroke-width="1" opacity="0.61"/><circle cx="1098.8" cy="513.8" r="3.4" fill="#13294B" stroke="#FFFFFF" stroke-width="1" opacity="0.69"/><circle cx="1048.5" cy="547.5" r="3.6" fill="#13294B" stroke="#FFFFFF" stroke-width="1" opacity="0.77"/><circle cx="989.9" cy="536.2" r="3.8" fill="#13294B" stroke="#FFFFFF" stroke-width="1" opacity="0.84"/><circle cx="939.6" cy="468.8" r="4.0" fill="#13294B" stroke="#FFFFFF" stroke-width="1" opacity="0.92"/><circle cx="906.1" cy="423.8" r="9" fill="#13294B" stroke="#FFFFFF" stroke-width="2"/><text x="680.0" y="520.0" class="d10-s" font-size="17" fill="#13294B" font-weight="700">Restordre</text><text x="680.0" y="542.0" class="d10-s" font-size="15" fill="#44546E">1,00 kr per enhet per uke</text><text x="1350.0" y="520.0" class="d10-s" font-size="17" fill="#13294B" font-weight="700" text-anchor="end">Lager</text><text x="1350.0" y="542.0" class="d10-s" font-size="15" fill="#44546E" text-anchor="end">0,50 kr per enhet per uke</text><line x1="906.1" y1="411.8" x2="1015.0" y2="188.0" stroke="#C5CEDA" stroke-width="1"/><text x="1015.0" y="148.0" class="d10-r" font-size="22" fill="#13294B" font-weight="700" text-anchor="middle">Én uke for ett sete</text><text x="1015.0" y="174.0" class="d10-s" font-size="17" fill="#44546E" text-anchor="middle">13 i restordre: 13,00 kr denne uka</text><text x="680.0" y="644.0" class="d10-s" font-size="14" fill="#5F6F88">Demodata. Ett sete ser bare sine egne tall.</text><line x1="90.0" y1="740.0" x2="1350.0" y2="740.0" stroke="#C5CEDA" stroke-width="1"/><text x="90.0" y="802.0" class="d10-r" font-size="38" fill="#13294B" font-weight="700">Alle spillene på én skjerm</text><text x="90.0" y="840.0" class="d10-s" font-size="18" fill="#44546E">Hvert punkt er ett Klassespill. Du ser spredningen i klassen med</text><text x="90.0" y="866.0" class="d10-s" font-size="18" fill="#44546E">ett blikk, og hvilke spill som venter på noen.</text><text x="90.0" y="920.0" class="d10-s" font-size="17" fill="#13294B">Kjører hele øvelsen fra invitasjon til PDF-rapport</text><line x1="90.0" y1="930.0" x2="590.0" y2="930.0" stroke="#E1E6ED" stroke-width="1"/><text x="90.0" y="952.0" class="d10-s" font-size="17" fill="#13294B">Klasser på rundt 250 studenter</text><line x1="90.0" y1="962.0" x2="590.0" y2="962.0" stroke="#E1E6ED" stroke-width="1"/><text x="90.0" y="984.0" class="d10-s" font-size="17" fill="#13294B">KI-spillere fyller tomme seter, alltid merket</text><line x1="90.0" y1="994.0" x2="590.0" y2="994.0" stroke="#E1E6ED" stroke-width="1"/><text x="90.0" y="1016.0" class="d10-s" font-size="17" fill="#13294B">Ett fravær stopper ikke gruppa</text><line x1="90.0" y1="1026.0" x2="590.0" y2="1026.0" stroke="#E1E6ED" stroke-width="1"/><text x="90.0" y="1048.0" class="d10-s" font-size="17" fill="#13294B">Ingen spill blir stående uferdig</text><line x1="90.0" y1="1058.0" x2="590.0" y2="1058.0" stroke="#E1E6ED" stroke-width="1"/><text x="90.0" y="1080.0" class="d10-s" font-size="17" fill="#13294B">På mobil og på norsk</text><line x1="90.0" y1="1090.0" x2="590.0" y2="1090.0" stroke="#E1E6ED" stroke-width="1"/><text x="90.0" y="1112.0" class="d10-s" font-size="17" fill="#13294B">Studentlisten kommer fra Canvas-eksport</text><line x1="90.0" y1="1122.0" x2="590.0" y2="1122.0" stroke="#E1E6ED" stroke-width="1"/><line x1="680.0" y1="1030.0" x2="680.0" y2="1035.0" stroke="#C5CEDA" stroke-width="1"/><text x="680.0" y="1051.0" class="d10-s d10-n" font-size="15" fill="#44546E" text-anchor="middle">0</text><line x1="856.3" y1="1030.0" x2="856.3" y2="1035.0" stroke="#C5CEDA" stroke-width="1"/><text x="856.3" y="1051.0" class="d10-s d10-n" font-size="15" fill="#44546E" text-anchor="middle">1 000</text><line x1="1032.6" y1="1030.0" x2="1032.6" y2="1035.0" stroke="#C5CEDA" stroke-width="1"/><text x="1032.6" y="1051.0" class="d10-s d10-n" font-size="15" fill="#44546E" text-anchor="middle">2 000</text><line x1="1208.9" y1="1030.0" x2="1208.9" y2="1035.0" stroke="#C5CEDA" stroke-width="1"/><text x="1208.9" y="1051.0" class="d10-s d10-n" font-size="15" fill="#44546E" text-anchor="middle">3 000</text><text x="1350.0" y="1051.0" class="d10-s" font-size="15" fill="#44546E" text-anchor="end">kr</text><line x1="680.0" y1="1030.0" x2="1350.0" y2="1030.0" stroke="#C5CEDA" stroke-width="1"/><line x