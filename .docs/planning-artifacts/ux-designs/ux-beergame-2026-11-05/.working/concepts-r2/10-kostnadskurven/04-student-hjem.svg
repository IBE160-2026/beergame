<svg xmlns="http://www.w3.org/2000/svg" id="d10-student-root" viewBox="0 0 1000 900" font-family="'Alegreya Sans','Gill Sans','Trebuchet MS',Verdana,sans-serif"><title>Kurve: student på mobil</title><desc>To telefoner: registrering fra Invitasjon og hjem under spill for Sara.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&amp;family=Alegreya+Sans:wght@400;500;700&amp;display=swap');
.d10-r{font-family:'Alegreya',Georgia,'Times New Roman',serif;font-variant-numeric:lining-nums proportional-nums}
.d10-s{font-family:'Alegreya Sans','Gill Sans','Trebuchet MS',Verdana,sans-serif;font-variant-numeric:lining-nums proportional-nums}
.d10-n{font-variant-numeric:lining-nums tabular-nums}</style><rect x="0.0" y="0.0" width="1000.0" height="900.0" fill="#EEF2F6"/><text x="70.0" y="30.0" class="d10-s" font-size="16" fill="#44546E">Registrering</text><text x="540.0" y="30.0" class="d10-s" font-size="16" fill="#44546E">Hjem under spill</text><text x="930.0" y="30.0" class="d10-s" font-size="14" fill="#5F6F88" text-anchor="end">Demodata</text><g transform="translate(70,44) scale(1.0)"><rect x="0.0" y="0.0" width="390.0" height="844.0" fill="#FFFFFF" stroke="#C5CEDA" stroke-width="1.2" rx="34"/><text x="22.0" y="66.0" class="d10-r" font-size="24" fill="#13294B" font-weight="700">Kurve</text><text x="22.0" y="124.0" class="d10-r" font-size="32" fill="#13294B" font-weight="700">Du er invitert</text><text x="22.0" y="158.0" class="d10-s" font-size="16" fill="#44546E">Bård har invitert deg til Klassen class-of-1994 i</text><text x="22.0" y="181.0" class="d10-s" font-size="16" fill="#44546E">IBE160. Invitasjonen er gyldig i 14 dager.</text><text x="22.0" y="245.0" class="d10-s" font-size="13" fill="#44546E">Navn</text><rect x="22.0" y="252.0" width="346.0" height="48.0" fill="#FFFFFF" stroke="#C5CEDA" stroke-width="1" rx="4"/><text x="32.0" y="281.4" class="d10-s" font-size="16" fill="#13294B">Sara Lunde</text><text x="22.0" y="325.0" class="d10-s" font-size="13" fill="#44546E">E-post, fra klasselista</text><rect x="22.0" y="332.0" width="346.0" height="48.0" fill="#FFFFFF" stroke="#C5CEDA" stroke-width="1" rx="4"/><text x="32.0" y="361.4" class="d10-s" font-size="16" fill="#5F6F88">sara.lunde@stud.no</text><text x="22.0" y="405.0" class="d10-s" font-size="13" fill="#44546E">Passord</text><rect x="22.0" y="412.0" width="346.0" height="48.0" fill="#FFFFFF" stroke="#C5CEDA" stroke-width="1" rx="4"/><text x="32.0" y="441.4" class="d10-s" font-size="16" fill="#5F6F88">Minst 10 tegn</text><rect x="22.0" y="490.0" width="346.0" height="52.0" fill="#13294B" rx="6"/><text x="195.0" y="521.8" class="d10-s" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">Opprett konto</text><line x1="22.0" y1="576.0" x2="368.0" y2="576.0" stroke="#E1E6ED" stroke-width="1"/><text x="22.0" y="610.0" class="d10-r" font-size="20" fill="#13294B" font-weight="700">Dette skjer videre</text><text x="22.0" y="638.0" class="d10-s" font-size="15" fill="#44546E">Du får et spill og en Rolle når faglæreren har fordelt</text><text x="22.0" y="660.0" class="d10-s" font-size="15" fill="#44546E">klassen. Dere spiller på telefonen, over flere kvelder</text><text x="22.0" y="682.0" class="d10-s" font-size="15" fill="#44546E">hvis dere vil. Tomme seter fylles av KI-spillere, og de</text><text x="22.0" y="704.0" class="d10-s" font-size="15" fill="#44546E">er alltid merket.</text></g><g transform="translate(540,44) scale(1.0)"><rect x="0.0" y="0.0" width="390.0" height="844.0" fill="#FFFFFF" stroke="#C5CEDA" stroke-width="1.2" rx="34"/><text x="22.0" y="66.0" class="d10-r" font-size="24" fill="#13294B" font-weight="700">Kurve</text><text x="368.0" y="64.0" class="d10-s" font-size="15" fill="#44546E" text-anchor="end">Sara</text><text x="22.0" y="112.0" class="d10-r" font-size="26" fill="#13294B" font-weight="700">Spill 17 · Grossist</text><text x="22.0" y="138.0" class="d10-s" font-size="16" fill="#13294B" font-weight="700">Spillet venter på deg, Uke 11</text><text x="22.0" y="162.0" class="d10-s" font-size="15" fill="#44546E">13 i restordre · 13,00 kr denne uka</text><rect x="22.0" y="178.0" width="346.0" height="50.0" fill="#13294B" rx="6"/><text x="195.0" y="208.8" class="d10-s" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">Legg inn ordre for Uke 11</text><text x="22.0" y="262.0" class="d10-r" font-size="18" fill="#13294B" font-weight="700">Setene</text><circle cx="28.0" cy="283.0" r="5" fill="#13294B"/><text x="42.0" y="288.0" class="d10-s" font-size="15" fill="#13294B" font-weight="500">Ida (Detaljist)</text><text x="368.0" y="288.0" class="d10-s" font-size="14" fill="#44546E" text-anchor="end">har bestilt</text><rect x="23.0" y="304.0" width="10.0" height="10.0" fill="#FFFFFF" stroke="#13294B" stroke-width="1.6" rx="2"/><text x="42.0" y="314.0" class="d10-s" font-size="15" fill="#13294B" font-weight="500">Sara (Grossist)</text><text x="368.0" y="314.0" class="d10-s" font-size="14" fill="#44546E" text-anchor="end">venter på deg</text><circle cx="28.0" cy="335.0" r="5" fill="#13294B"/><text x="42.0" y="340.0" class="d10-s" font-size="15" fill="#13294B" font-weight="500">Mikkel (Distributør)</text><text x="368.0" y="340.0" class="d10-s" font-size="14" fill="#44546E" text-anchor="end">har bestilt</text><circle cx="28.0" cy="361.0" r="5" fill="#FFFFFF" stroke="#13294B" stroke-width="1.6"/><text x="42.0" y="366.0" class="d10-s" font-size="15" fill="#13294B" font-weight="500">Jonas (Fabrikk)</text><text x="368.0" y="366.0" class="d10-s" font-size="14" fill="#44546E" text-anchor="end">venter, 3 min</text><line x1="22.0" y1="400.0" x2="368.0" y2="400.0" stroke="#E1E6ED" stroke-width="1"/><text x="22.0" y="430.0" class="d10-r" font-size="18" fill="#13294B" font-weight="700">Dine steg</text><circle cx="28.0" cy="449.0" r="4.5" fill="#13294B"/><text x="44.0" y="454.0" class="d10-s" font-size="15" fill="#13294B" font-weight="700">Klassespill</text><text x="368.0" y="454.0" class="d10-s" font-size="14" fill="#13294B" text-anchor="end">pågår, Spillfrist ti. 8. des</text><circle cx="28.0" cy="474.0" r="4.5" fill="#FFFFFF" stroke="#C5CEDA" stroke-width="1.6"/><text x="44.0" y="479.0" class="d10-s" font-size="15" fill="#13294B">Debrief</text><text x="368.0" y="479.0" class="d10-s" font-size="14" fill="#44546E" text-anchor="end">Debrief-frist fr. 11. des</text><circle cx="28.0" cy="499.0" r="4.5" fill="#FFFFFF" stroke="#C5CEDA" stroke-width="1.6"/><text x="44.0" y="504.0" class="d10-s" font-size="15" fill="#13294B">Quiz</text><text x="368.0" y="504.0" class="d10-s" font-size="14" fill="#44546E" text-anchor="end">etter Debrief</text><circle cx="28.0" cy="524.0" r="4.5" fill="#FFFFFF" stroke="#C5CEDA" stroke-width="1.6"/><text x="44.0" y="529.0" class="d10-s" font-size="15" fill="#13294B">Replay</text><text x="368.0" y="529.0" class="d10-s" font-size="14" fill="#44546E" text-anchor="end">etter Quiz</text><circle cx="28.0" cy="549.0" r="4.5" fill="#FFFFFF" stroke="#C5CEDA" stroke-width="1.6"/><text x="44.0" y="554.0" class="d10-s" font-size="15" fill="#13294B">Individuell test</text><text x="368.0" y="554.0" class="d10-s" font-size="14" fill="#44546E" text-anchor="end">Testfrist fr. 18. des</text><circle cx="28.0" cy="574.0" r="4.5" fill="#FFFFFF" stroke="#C5CEDA" stroke-width="1.6"/><text x="44.0" y="579.0" class="d10-s" font-size="15" fill="#13294B">Rapport</text><text x="368.0" y="579.0" class="d10-s" font-size="14" fill="#44546E" text-anchor="end">PDF etter test</text><line x1="22.0" y1="596.0" x2="368.0" y2="596.0" stroke="#E1E6ED" stroke-width="1"/><text x="22.0" y="626.0" class="d10-s" font-size="15" fill="#44546E">Neste frist</text><text x="368.0" y="626.0" class="d10-s" font-size="15" fill="#13294B" font-weight="700" text-anchor="end">Spillfrist ti. 8. des</text><line x1="22.0" y1="638.0" x2="368.0" y2="638.0" stroke="#E1E6ED" stroke-width="1"/><text x="22.0" y="666.0" class="d10-s" font-size="15" fill="#44546E">Labtimer, Datalab A2</text><text x="22.0" y="688.0" class="d10-s" font-size="15" fill="#13294B">to. 26. nov 14:15</text><text x="368.0" y="688.0" class="d10-s" font-size="15" fill="#13294B" text-anchor="end">ma. 30. nov 10:15</text><text x="22.0" y="710.0" class="d10-s" font-size="15" fill="#13294B">to. 3. des 14:15</text><text x="368.0" y="710.0" class="d10-s" font-size="15" fill="#13294B" text-anchor="end">ma. 7. des 10:15</text></g></svg>