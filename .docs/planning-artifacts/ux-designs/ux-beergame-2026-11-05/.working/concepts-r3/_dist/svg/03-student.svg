<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="'Source Sans 3','Source Sans Pro','Segoe UI',Arial,sans-serif"><title>Kostnadsregnskapet, student på mobil</title><desc>To telefoner: registrering via Invitasjon, og hjem under spill med regnskapet så langt.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap');.e03-t{font-family:'Source Sans 3','Source Sans Pro','Segoe UI',Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums;}</style><rect x="0" y="0" width="1000" height="900" fill="#FFFFFF"/><text class="e03-t" x="70.0" y="34.0" font-size="18" font-weight="600" fill="#0F2A47" text-anchor="start">Registrering</text><text class="e03-t" x="560.0" y="34.0" font-size="18" font-weight="600" fill="#0F2A47" text-anchor="start">Hjem under spill</text><rect x="70.0" y="48.0" width="378.3" height="818.7" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1.4" rx="34.92"/><g transform="translate(70,48) scale(0.97)"><text class="e03-t" x="20.0" y="72.0" font-size="30" font-weight="700" fill="#0F2A47" text-anchor="start">Du er invitert</text><text class="e03-t" x="20.0" y="102.0" font-size="15" font-weight="400" fill="#44586F" text-anchor="start">Faglærer Bård har lagt deg til i class-of-1994,</text><text class="e03-t" x="20.0" y="122.0" font-size="15" font-weight="400" fill="#44586F" text-anchor="start">IBE160.</text><text class="e03-t" x="20.0" y="190.0" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="start">Navn</text><rect x="20.0" y="198.0" width="350.0" height="54.0" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1" rx="5"/><text class="e03-t" x="32.0" y="230.1" font-size="15" font-weight="400" fill="#0F2A47" text-anchor="start">Sara Lund</text><text class="e03-t" x="20.0" y="286.0" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="start">E-post, fra klasselisten</text><rect x="20.0" y="294.0" width="350.0" height="54.0" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1" rx="5"/><text class="e03-t" x="32.0" y="326.1" font-size="15" font-weight="400" fill="#0F2A47" text-anchor="start">sara.lund@stud.example.no</text><text class="e03-t" x="20.0" y="382.0" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="start">Velg passord</text><rect x="20.0" y="390.0" width="350.0" height="54.0" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1" rx="5"/><text class="e03-t" x="32.0" y="422.1" font-size="15" font-weight="400" fill="#5E6F82" text-anchor="start">Minst 10 tegn</text><rect x="20.0" y="484.0" width="350.0" height="56.0" fill="#0F2A47" rx="6"/><text class="e03-t" x="195.0" y="517.4" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Opprett konto og gå videre</text><text class="e03-t" x="20.0" y="574.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Invitasjonen er gyldig i 14 dager. Du får Rolle og spill når</text><text class="e03-t" x="20.0" y="593.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Faglærer har bekreftet fordelingen.</text><text class="e03-t" x="20.0" y="654.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Har du konto?</text><text class="e03-t" x="112.0" y="654.0" font-size="14" font-weight="600" fill="#2B6CA3" text-anchor="start" text-decoration="underline">Logg inn</text></g><rect x="560.0" y="48.0" width="378.3" height="818.7" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1.4" rx="34.92"/><g transform="translate(560,48) scale(0.97)"><text class="e03-t" x="20.0" y="62.0" font-size="28" font-weight="700" fill="#0F2A47" text-anchor="start">Spill 17</text><text class="e03-t" x="20.0" y="84.0" font-size="15" font-weight="400" fill="#44586F" text-anchor="start">Du er Grossist</text><rect x="20.0" y="100.0" width="350.0" height="232.0" fill="#F2F5F8" rx="6"/><text class="e03-t" x="32.0" y="124.0" font-size="16" font-weight="600" fill="#0F2A47" text-anchor="start">Spillet venter på deg</text><text class="e03-t" x="358.0" y="