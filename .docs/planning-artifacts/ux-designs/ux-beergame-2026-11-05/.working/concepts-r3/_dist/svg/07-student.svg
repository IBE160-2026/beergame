" cy="521.0" r="6" fill="#0F2A47"/><text class="e07-t" x="42.0" y="526.0" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="start">Klassespill</text><text class="e07-t" x="370.0" y="526.0" font-size="14" font-weight="400" fill="#0F2A47" text-anchor="end">pågår</text><text class="e07-t" x="42.0" y="543.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Lag: Graf, Tall, Kostnad</text><circle cx="26.0" cy="559.0" r="5" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1.5"/><text class="e07-t" x="42.0" y="564.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Debrief</text><text class="e07-t" x="42.0" y="581.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Åpner Posisjon, Hele kjeden, Simulert</text><circle cx="26.0" cy="597.0" r="5" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1.5"/><text class="e07-t" x="42.0" y="602.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Quiz</text><circle cx="26.0" cy="621.0" r="5" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1.5"/><text class="e07-t" x="42.0" y="626.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Replay</text><text class="e07-t" x="42.0" y="643.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Åpner Projeksjon</text><circle cx="26.0" cy="659.0" r="5" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1.5"/><text class="e07-t" x="42.0" y="664.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Individuell test</text><circle cx="26.0" cy="683.0" r="5" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1.5"/><text class="e07-t" x="42.0" y="688.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Rapport</text><line x1="20.0" y1="702.0" x2="370.0" y2="702.0" stroke="#E1E6EC" stroke-width="1"/><text class="e07-t" x="20.0" y="722.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Neste frist</text><text class="e07-t" x="370.0" y="722.0" font-size