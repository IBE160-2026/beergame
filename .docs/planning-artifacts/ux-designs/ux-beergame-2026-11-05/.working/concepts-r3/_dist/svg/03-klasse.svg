<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" font-family="'Source Sans 3','Source Sans Pro','Segoe UI',Arial,sans-serif"><title>Kostnadsregnskapet, lag Klasse</title><desc>Faglærer lager Klasse, laster opp Canvas-eksport, velger e-postkolonne, ser ugyldige rader og sender Invitasjoner.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap');.e03-t{font-family:'Source Sans 3','Source Sans Pro','Segoe UI',Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums;}</style><rect x="0" y="0" width="1440" height="1000" fill="#FFFFFF"/><text class="e03-t" x="80.0" y="62.0" font-size="34" font-weight="700" fill="#0F2A47" text-anchor="start">Lag Klasse</text><text class="e03-t" x="80.0" y="90.0" font-size="16" font-weight="400" fill="#44586F" text-anchor="start">Klasselisten kommer fra Canvas-eksporten din. Ingenting sendes før du trykker send.</text><text class="e03-t" x="80.0" y="150.0" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="start">Navn</text><rect x="80.0" y="158.0" width="420.0" height="50.0" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1" rx="5"/><text class="e03-t" x="92.0" y="188.1" font-size="15" font-weight="400" fill="#0F2A47" text-anchor="start">class-of-1994</text><text class="e03-t" x="80.0" y="248.0" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="start">Emnekode</text><rect x="80.0" y="256.0" width="420.0" height="50.0" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1" rx="5"/><text class="e03-t" x="92.0" y="286.1" font-size="15" font-weight="400" fill="#0F2A47" text-anchor="start">IBE160</text><text class="e03-t" x="80.0" y="346.0" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="start">Canvas-eksport</text><rect x="80.0" y="354.0" width="420.0" height="62.0" fill="#F2F5F8" stroke="#C3CDD8" stroke-width="1" rx="5"/><text class="e03-t" x="92.0" y="380.0" font-size="15" font-weight="600" fill="#0F2A47" text-anchor="start">ibe160-ca