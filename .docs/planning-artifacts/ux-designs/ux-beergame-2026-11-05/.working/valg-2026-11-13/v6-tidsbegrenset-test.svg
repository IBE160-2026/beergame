<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 690" font-family="'Source Sans 3','Source Sans Pro','Segoe UI',Arial,sans-serif"><title>Valg 6: Tidsbegrenset test i én økt</title><desc>Tre alternativer for hvordan en test med tidsgrense vises, eller om den venter til etter v1.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap');.v-t{font-family:'Source Sans 3','Source Sans Pro','Segoe UI',Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums;}</style><rect x="0" y="0" width="1620" height="690" fill="#FFFFFF"/><text class="v-t" x="40.0" y="50.0" font-size="26" font-weight="700" fill="#0F2A47" text-anchor="start">Valg 6  Individuell test i én økt med tidsgrense: hvordan vises tiden?</text><text class="v-t" x="40.0" y="82.0" font-size="15" font-weight="600" fill="#0F2A47" text-anchor="start">I dag</text><text class="v-t" x="92.0" y="82.0" font-size="15" font-weight="400" fill="#44586F" text-anchor="start">FR-51 lar Faglærer kreve én økt med tidsgrense, og Story 11.12 bygger det. EXPERIENCE.md sier at «I rommet» er den eneste tidsbegrensede økta i v1, og har verken tilstander eller tekst for en test der klokka går. Tilrettelegging</text><text class="v-t" x="92.0" y="103.0" font-size="15" font-weight="400" fill="#44586F" text-anchor="start">nevner bare ventetid før KI tar over.</text><text class="v-t" x="40.0" y="138.0" font-size="20" font-weight="700" fill="#0F2A47" text-anchor="start">A</text><text class="v-t" x="66.0" y="138.0" font-size="20" font-weight="600" fill="#0F2A47" text-anchor="start">Synlig tid igjen</text><text class="v-t" x="40.0" y="164.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Tiden som er igjen står øverst på testen hele tiden.</text><text class="v-t" x="565.0" y="138.0" font-size="20" font-weight="700" fill="#0F2A47" text-anchor="start">B</text><text class="v-t" x="591.0" y="138.0" font-size="20" font-weight="600" fill="#0F2A47" text-anchor="start">Sluttid i tekst, ingen nedtelling</text><text class="v-t" x="565.0" y="164.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Testen sier når den lukkes. Ingenting teller ned på skjermen.</text><text class="v-t" x="1090.0" y="138.0" font-size="20" font-weight="700" fill="#0F2A47" text-anchor="start">C</text><text class="v-t" x="1116.0" y="138.0" font-size="20" font-weight="600" fill="#0F2A47" text-anchor="start">Venter til etter v1</text><text class="v-t" x="1090.0" y="164.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Testen har ingen tidsgrense i v1. Studenten kan lukke den og komme tilbake fram</text><text class="v-t" x="1090.0" y="184.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">til Testfrist.</text><rect x="40.0" y="218.0" width="490.0" height="170.0" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1.2" rx="10"/><text class="v-t" x="60.0" y="252.0" font-size="17" font-weight="700" fill="#0F2A47" text-anchor="start">Individuell test</text><text class="v-t" x="60.0" y="272.0" font-size="12" font-weight="400" fill="#5E6F82" text-anchor="start">Spørsmål 4 av 12 · Lagret 21:14</text><rect x="382.1" y="234.0" width="127.9" height="32.0" fill="#FFFFFF" stroke="#0F2A47" stroke-width="1.2" rx="5"/><text class="v-t" x="446.0" y="255.0" font-size="15" font-weight="600" fill="#0F2A47" text-anchor="middle">Tid igjen 38 min</text><rect x="60.0" y="300.0" width="450.0" height="8.0" fill="#E1E6EC"/><rect x="60.0" y="316.0" width="315.0" height="8.0" fill="#E1E6EC"/><text class="v-t" x="40.0" y="424.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Underveis</text><text class="v-t" x="136.0" y="424.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">«Tid igjen 38 min» øverst, oppdatert uten at fokus flyttes.</text><text class="v-t" x="40.0" y="448.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">5 min igjen</text><text class="v-t" x="136.0" y="448.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Leses opp én gang: «5 minutter igjen. Svarene dine er lagret.»</text><text class="v-t" x="40.0" y="472.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Tiden er ute</text><text class="v-t" x="136.0" y="472.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">«Tiden er ute. Testen er levert.»</text><text class="v-t" x="40.0" y="496.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Tilrettelegging</text><text class="v-t" x="136.0" y="496.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Faktoren gjelder tidsgrensen: 60 min blir 90 min ved 1,5.</text><rect x="565.0" y="218.0" width="490.0" height="170.0" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1.2" rx="10"/><text class="v-t" x="585.0" y="252.0" font-size="17" font-weight="700" fill="#0F2A47" text-anchor="start">Individuell test</text><text class="v-t" x="585.0" y="272.0" font-size="12" font-weight="400" fill="#5E6F82" text-anchor="start">Spørsmål 4 av 12 · Lagret 21:14</text><text class="v-t" x="585.0" y="300.0" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="start">Testen lukkes kl. 21:40.</text><rect x="585.0" y="324.0" width="450.0" height="8.0" fill="#E1E6EC"/><rect x="585.0" y="340.0" width="315.0" height="8.0" fill="#E1E6EC"/><text class="v-t" x="565.0" y="424.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Underveis</text><text class="v-t" x="661.0" y="424.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Linja «Testen lukkes kl. 21:40.» står stille under tittelen.</text><text class="v-t" x="565.0" y="448.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">5 min igjen</text><text class="v-t" x="661.0" y="448.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Leses opp én gang: «Testen lukkes om 5 minutter. Svarene dine er</text><text class="v-t" x="661.0" y="466.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">lagret.»</text><text class="v-t" x="565.0" y="490.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Tiden er ute</text><text class="v-t" x="661.0" y="490.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">«Tiden er ute. Testen er levert.»</text><text class="v-t" x="565.0" y="514.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Tilrettelegging</text><text class="v-t" x="661.0" y="514.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Faktoren flytter sluttiden: kl. 21:40 blir kl. 22:10 ved 1,5.</text><rect x="1090.0" y="218.0" width="490.0" height="170.0" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1.2" rx="10"/><text class="v-t" x="1110.0" y="252.0" font-size="17" font-weight="700" fill="#0F2A47" text-anchor="start">Individuell test</text><text class="v-t" x="1110.0" y="272.0" font-size="12" font-weight="400" fill="#5E6F82" text-anchor="start">Spørsmål 4 av 12 · Lagret 21:14</text><rect x="1110.0" y="300.0" width="450.0" height="8.0" fill="#E1E6EC"/><rect x="1110.0" y="316.0" width="315.0" height="8.0" fill="#E1E6EC"/><text class="v-t" x="1110.0" y="366.0" font-size="12" font-weight="400" fill="#5E6F82" text-anchor="start">Du kan lukke testen og komme tilbake fram til Testfrist fr. 18. des.</text><text class="v-t" x="1090.0" y="424.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Underveis</text><text class="v-t" x="1186.0" y="424.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Som i dag: «Lagret 21:14», ingen tid.</text><text class="v-t" x="1090.0" y="448.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Testfrist</text><text class="v-t" x="1186.0" y="448.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Det som er lagret leveres automatisk (FR-51).</text><text class="v-t" x="1090.0" y="472.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Klasseøkt</text><text class="v-t" x="1186.0" y="472.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Valget «Én økt med tidsgrense» tilbys ikke.</text><text class="v-t" x="1090.0" y="496.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Tilrettelegging</text><text class="v-t" x="1186.0" y="496.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Uendret.</text><line x1="40.0" y1="550.0" x2="530.0" y2="550.0" stroke="#E1E6EC" stroke-width="1"/><text class="v-t" x="40.0" y="568.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Følger av valget</text><text class="v-t" x="40.0" y="587.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">EXPERIENCE.md får tilstander og tekst for klokka, og Tilrettelegging nevner testen.</text><text class="v-t" x="40.0" y="605.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Story 11.12 og 8.9 står som de er.</text><line x1="565.0" y1="550.0" x2="1055.0" y2="550.0" stroke="#E1E6EC" stroke-width="1"/><text class="v-t" x="565.0" y="568.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Følger av valget</text><text class="v-t" x="565.0" y="587.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Som A i EXPERIENCE.md, men uten et tall som teller ned. Studenten regner selv ut hvor</text><text class="v-t" x="565.0" y="605.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">lang tid som er igjen.</text><line x1="1090.0" y1="550.0" x2="1580.0" y2="550.0" stroke="#E1E6EC" stroke-width="1"/><text class="v-t" x="1090.0" y="568.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Følger av valget</text><text class="v-t" x="1090.0" y="587.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">EXPERIENCE.md står som den er. Story 11.12 tas ut av v1 eller legges bak et flagg, og</text><text class="v-t" x="1090.0" y="605.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">FR-51 i PRD får samme merknad.</text><text class="v-t" x="40.0" y="668.0" font-size="13" font-weight="400" fill="#5E6F82" text-anchor="start">Ny tekst i figurene er utkast. Ordlyden bestemmes etter valget.</text></svg>