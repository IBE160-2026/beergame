0" fill="#0F2A47"/><rect x="1572.5" y="477.0" width="7.0" height="12.0" fill="#0F2A47"/><text class="v-t" x="1090.0" y="539.0" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="start">35 beskjeder</text><text class="v-t" x="1090.0" y="559.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Én per Uke. I en Labtime kommer alle i løpet av én økt. Bryter regelen om én e-post per</text><text class="v-t" x="1090.0" y="577.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">dag.</text><line x1="40.0" y1="607.0" x2="530.0" y2="607.0" stroke="#E1E6EC" stroke-width="1"/><text class="v-t" x="40.0" y="625.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Følger av valget</text><text class="v-t" x="40.0" y="644.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Én linje tas ut av EXPERIENCE.md. Ingen story endres.</text><line x1="565.0" y1="607.0" x2="1055.0" y2="607.0" stroke="#E1E6EC" stroke-width="1"/><text class="v-t" x="565.0" y="625.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Følger av valget</text><text class="v-t" x="565.0" y="644.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Ny tekst i EXPERIENCE.md og i Story 6.12 eller 6.14. Ingen ny funksjon.</text><line x1="1090.0" y1="607.0" x2="1580.0" y2="607.0" stroke="#E1E6EC" stroke-width="1"/><text class="v-t" x="1090.0" y="625.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Følger av valget</text><text class="v-t" x="1090.0" y="644.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Nytt krav: FR-27 i PRD og AD-9 i arkitekturen endres, og beskjeden trenger en ny story.</text><text class="v-t" x="40.0" y="678.0" font-size="13" font-weight="400" fill="#5E6F82" text-anchor="start">Ny tekst i figurene er utkast. Ordlyden bestemmes etter valget.</text></svg>