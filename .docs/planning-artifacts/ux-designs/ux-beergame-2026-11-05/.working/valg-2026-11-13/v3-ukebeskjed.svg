<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 700" font-family="'Source Sans 3','Source Sans Pro','Segoe UI',Arial,sans-serif"><title>Valg 3: Linja om beskjed når neste Uke åpner</title><desc>Tre alternativer for hva skjermen lover etter at ordren er sendt.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap');.v-t{font-family:'Source Sans 3','Source Sans Pro','Segoe UI',Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums;}</style><rect x="0" y="0" width="1620" height="700" fill="#FFFFFF"/><text class="v-t" x="40.0" y="50.0" font-size="26" font-weight="700" fill="#0F2A47" text-anchor="start">Valg 3  Etter ordren: hva lover linja «Du får beskjed når Uke 12 åpner.»?</text><text class="v-t" x="40.0" y="82.0" font-size="15" font-weight="600" fill="#0F2A47" text-anchor="start">I dag</text><text class="v-t" x="92.0" y="82.0" font-size="15" font-weight="400" fill="#44586F" text-anchor="start">Linja står på skjermen etter at ordren er sendt. Ingen slik beskjed finnes. FR-27 sender bare e-post når spillet har ventet på Studenten en stund, samlet i én e-post per dag og aldri om natten.</text><text class="v-t" x="40.0" y="117.0" font-size="20" font-weight="700" fill="#0F2A47" text-anchor="start">A</text><text class="v-t" x="66.0" y="117.0" font-size="20" font-weight="600" fill="#0F2A47" text-anchor="start">Linja fjernes</text><text class="v-t" x="40.0" y="143.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Skjermen sier at ordren er sendt og hvem spillet venter på. Ikke noe mer.</text><text class="v-t" x="565.0" y="117.0" font-size="20" font-weight="700" fill="#0F2A47" text-anchor="start">B</text><text class="v-t" x="591.0" y="117.0" font-size="20" font-weight="600" fill="#0F2A47" text-anchor="start">Linja sier det som faktisk skjer</text><text class="v-t" x="565.0" y="143.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Linja byttes med en som er sann: skjermen går videre av seg selv, og e-post</text><text class="v-t" x="565.0" y="163.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">kommer bare når spillet venter.</text><text class="v-t" x="1090.0" y="117.0" font-size="20" font-weight="700" fill="#0F2A47" text-anchor="start">C</text><text class="v-t" x="1116.0" y="117.0" font-size="20" font-weight="600" fill="#0F2A47" text-anchor="start">Beskjed for hver Uke</text><text class="v-t" x="1090.0" y="143.0" font-size="14" font-weight="400" fill="#44586F" text-anchor="start">Løftet beholdes, og systemet sender en beskjed hver gang en ny Uke åpner.</text><rect x="40.0" y="197.0" width="490.0" height="222.0" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1.2" rx="12"/><text class="v-t" x="60.0" y="231.0" font-size="15" font-weight="600" fill="#0F2A47" text-anchor="start">Ordren på 24 er sendt. Venter på Jonas.</text><circle cx="65.0" cy="259.0" r="4" fill="#0F2A47"/><text class="v-t" x="78.0" y="263.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Detaljist</text><text class="v-t" x="156.0" y="263.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Ida</text><text class="v-t" x="510.0" y="263.0" font-size="12" font-weight="400" fill="#44586F" text-anchor="end">har bestilt</text><circle cx="65.0" cy="281.0" r="4" fill="#0F2A47"/><text class="v-t" x="78.0" y="285.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Grossist</text><text class="v-t" x="156.0" y="285.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Sara</text><text class="v-t" x="510.0" y="285.0" font-size="12" font-weight="400" fill="#44586F" text-anchor="end">har bestilt</text><circle cx="65.0" cy="303.0" r="4" fill="#0F2A47"/><text class="v-t" x="78.0" y="307.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Distributør</text><text class="v-t" x="156.0" y="307.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Mikkel</text><text class="v-t" x="510.0" y="307.0" font-size="12" font-weight="400" fill="#44586F" text-anchor="end">har bestilt</text><circle cx="65.0" cy="325.0" r="3.2" fill="#FFFFFF" stroke="#0F2A47" stroke-width="1.6"/><text class="v-t" x="78.0" y="329.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Fabrikk</text><text class="v-t" x="156.0" y="329.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Jonas</text><text class="v-t" x="510.0" y="329.0" font-size="12" font-weight="400" fill="#44586F" text-anchor="end">venter, 3 min</text><rect x="52.0" y="345.0" width="466.0" height="29.0" fill="none" stroke="#0F2A47" stroke-width="1.2" rx="4" stroke-dasharray="5 4"/><text class="v-t" x="60.0" y="363.0" font-size="13" font-weight="400" fill="#5E6F82" text-anchor="start">(ingen linje her)</text><text class="v-t" x="40.0" y="459.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Beskjeder til Sara i ett spill på 36 Uker</text><line x1="44.0" y1="493.0" x2="526.0" y2="493.0" stroke="#C3CDD8" stroke-width="1"/><line x1="44.0" y1="493.0" x2="44.0" y2="498.0" stroke="#C3CDD8" stroke-width="1"/><text class="v-t" x="44.0" y="512.0" font-size="12" font-weight="400" fill="#5E6F82" text-anchor="start">Uke 1</text><line x1="195.5" y1="493.0" x2="195.5" y2="498.0" stroke="#C3CDD8" stroke-width="1"/><text class="v-t" x="195.5" y="512.0" font-size="12" font-weight="400" fill="#5E6F82" text-anchor="middle">Uke 12</text><line x1="360.7" y1="493.0" x2="360.7" y2="498.0" stroke="#C3CDD8" stroke-width="1"/><text class="v-t" x="360.7" y="512.0" font-size="12" font-weight="400" fill="#5E6F82" text-anchor="middle">Uke 24</text><line x1="526.0" y1="493.0" x2="526.0" y2="498.0" stroke="#C3CDD8" stroke-width="1"/><text class="v-t" x="526.0" y="512.0" font-size="12" font-weight="400" fill="#5E6F82" text-anchor="end">Uke 36</text><rect x="150.7" y="477.0" width="7.0" height="12.0" fill="#0F2A47"/><rect x="260.8" y="477.0" width="7.0" height="12.0" fill="#0F2A47"/><rect x="412.3" y="477.0" width="7.0" height="12.0" fill="#0F2A47"/><text class="v-t" x="40.0" y="539.0" font-size="14" font-weight="600" fill="#0F2A47" text-anchor="start">3 e-poster</text><text class="v-t" x="40.0" y="559.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Bare når spillet har ventet på Sara, som i dag (FR-27).</text><rect x="565.0" y="197.0" width="490.0" height="222.0" fill="#FFFFFF" stroke="#C3CDD8" stroke-width="1.2" rx="12"/><text class="v-t" x="585.0" y="231.0" font-size="15" font-weight="600" fill="#0F2A47" text-anchor="start">Ordren på 24 er sendt. Venter på Jonas.</text><circle cx="590.0" cy="259.0" r="4" fill="#0F2A47"/><text class="v-t" x="603.0" y="263.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Detaljist</text><text class="v-t" x="681.0" y="263.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Ida</text><text class="v-t" x="1035.0" y="263.0" font-size="12" font-weight="400" fill="#44586F" text-anchor="end">har bestilt</text><circle cx="590.0" cy="281.0" r="4" fill="#0F2A47"/><text class="v-t" x="603.0" y="285.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Grossist</text><text class="v-t" x="681.0" y="285.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Sara</text><text class="v-t" x="1035.0" y="285.0" font-size="12" font-weight="400" fill="#44586F" text-anchor="end">har bestilt</text><circle cx="590.0" cy="303.0" r="4" fill="#0F2A47"/><text class="v-t" x="603.0" y="307.0" font-size="13" font-weight="600" fill="#0F2A47" text-anchor="start">Distributør</text><text class="v-t" x="681.0" y="307.0" font-size="13" font-weight="400" fill="#44586F" text-anchor="start">Mikkel</text><text class="v-t" x="1035.0" y="307.0" font-size="12" font-weight="400" fill="#44586F" text-anchor="end">har bestilt</text><circle cx="590.0" cy="325.0" r="3.2" fill="#FFFFFF" stroke="#0F2A47" stroke-width="1.6"/><text class