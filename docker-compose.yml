# Local stack. Runs with no .env file: every variable has an inline default,
# and every integration is a mock (AD-17).
name: olspillet

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olspillet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olspillet}
      POSTGRES_DB: ${POSTGRES_DB:-olspillet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    # Every image builds from the repo root, as on Railway (railway/<service>/railway.toml).
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: olspillet-backend:${IMAGE_TAG:-local}
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-olspillet}:${POSTGRES_PASSWORD:-olspillet}@postgres:5432/${POSTGRES_DB:-olspillet}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # bcrypt's minimum cost locally, so the Playwright login tests stay fast. The app's own
      # default (12) applies everywhere this is not set, production included.
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-4}
      # Password-reset limits (Story 3.6) far above the app's defaults (5 per address, 50 per IP
      # an hour), so repeated Playwright runs on one stack never hit them. The api tests check
      # the limits themselves.
      # The per-IP login limit (Story 3.2) far above the app's default (300 an IP per 15 min): every
      # Playwright browser logs in from 127.0.0.1, and the lockout and wrong-password tests leave
      # failed attempts behind, so repeated runs inside one window would lock every login out. The
      # per-account limit stays at the default, which the lockout test checks.
      LOGIN_RATE_LIMIT_PER_IP: ${LOGIN_RATE_LIMIT_PER_IP:-100000}
      PASSWORD_RESET_RATE_LIMIT_PER_ACCOUNT: ${PASSWORD_RESET_RATE_LIMIT_PER_ACCOUNT:-1000}
      PASSWORD_RESET_RATE_LIMIT_PER_IP: ${PASSWORD_RESET_RATE_LIMIT_PER_IP:-10000}
      # Invitation accept and renewal limits (Story 3.8) far above the app's defaults (50 accepts
      # and 20 renewals per IP, 10 and 3 per link, an hour), for the same reason; the api tests
      # check these limits too.
      INVITATION_ACCEPT_RATE_LIMIT_PER_IP: ${INVITATION_ACCEPT_RATE_LIMIT_PER_IP:-10000}
      INVITATION_ACCEPT_RATE_LIMIT_PER_INVITATION: ${INVITATION_ACCEPT_RATE_LIMIT_PER_INVITATION:-1000}
      INVITATION_RENEWAL_RATE_LIMIT_PER_IP: ${INVITATION_RENEWAL_RATE_LIMIT_PER_IP:-10000}
      INVITATION_RENEWAL_RATE_LIMIT_PER_INVITATION: ${INVITATION_RENEWAL_RATE_LIMIT_PER_INVITATION:-1000}
      # The lecturer-access request limit (Story 3.13) far above the app's default (20 per IP an
      # hour), for the same reason; the api tests check the limit.
      ACCESS_REQUEST_RATE_LIMIT_PER_IP: ${ACCESS_REQUEST_RATE_LIMIT_PER_IP:-10000}
      # Mail (Story 3.5). No RESEND_API_KEY is passed, so every mail is the `[email:mock]` log
      # line locally, whatever the shell or .env holds (AD-17).
      EMAIL_FROM: ${EMAIL_FROM:-ØL-spillet <noreply@olspillet.local>}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      FEATURE_STUDENT_CHOICE: ${FEATURE_STUDENT_CHOICE:-true}
      FEATURE_CROSS_INSTITUTION_STATS: ${FEATURE_CROSS_INSTITUTION_STATS:-true}
      FEATURE_RERUN: ${FEATURE_RERUN:-true}
      FEATURE_INFO_VISIBILITY: ${FEATURE_INFO_VISIBILITY:-true}
      FEATURE_LECTURER_TEST_GAME: ${FEATURE_LECTURER_TEST_GAME:-true}
      FEATURE_GAME_DATA_EXPORT: ${FEATURE_GAME_DATA_EXPORT:-true}
      FEATURE_CAPACITY: ${FEATURE_CAPACITY:-true}
    # The storage mock (Story 13.7, AD-17): no storage keys are passed, so the Student reports go
    # to this volume, shared with `worker-batch`.
    volumes:
      - report-files:/app/.local-storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Job workers (AD-9, AD-24): the image `backend` builds, so the same commit; no keys (the AI
  # mock answers locally). The backend applies the migrations; the workers start once it is
  # healthy.
  worker-ai:
    image: olspillet-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["python", "-m", "app.worker", "--queues", "ai-orders"]
    environment: &worker-env
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-olspillet}:${POSTGRES_PASSWORD:-olspillet}@postgres:5432/${POSTGRES_DB:-olspillet}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_MIGRATIONS: "false"
      EMAIL_FROM: ${EMAIL_FROM:-ØL-spillet <noreply@olspillet.local>}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
    depends_on:
      backend:
        condition: service_healthy

  worker-batch:
    image: olspillet-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    # The mail queue and the per-minute sweeper (Story 3.5, AD-9): only this worker sweeps.
    # Story 13.7: one Student report at a time per request, on slots of its own
    # (REPORTS_SINGLE_RESERVED); it fetches the print route from the frontend and stores the
    # PDF in the storage mock's volume, which `backend` serves the signed downloads from.
    command: ["python", "-m", "app.worker", "--queues", "llm-batch,mail,reports-single", "--sweeper"]
    environment:
      <<: *worker-env
      WEB_INTERNAL_URL: ${WEB_INTERNAL_URL:-http://frontend:3000}
    volumes:
      - report-files:/app/.local-storage
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    environment:
      PORT: 8080
      API_UPSTREAM: backend:8000
      WEB_UPSTREAM: frontend:3000
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pgdata:
  report-files:
