[project]
name = "olspillet-api"
version = "0.1.0"
description = "ØL-spillet API, workers and simulation runner"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.8",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "structlog==26.1.0",
    "pydantic-ai-slim[openai]==2.65.0",
    "procrastinate==3.11.0",
    "httpx2==2.16.2",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "jinja2==3.1.6",
    "tzdata==2026.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "httpx==0.28.1",
    "ruff==0.17.5",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
# One worker per CPU, at most 12, each with databases of its own (tests/conftest.py).
# `-n0` runs in one process, the fastest way to run a single file.
addopts = "-n auto --maxprocesses=12 --dist worksteal"

[tool.coverage.run]
branch = true
