# Alembic owns every schema change (AD-24). DATABASE_URL comes from
# app.platform.config, never from this file, and logging is the app's
# structlog JSON setup (see migrations/env.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
