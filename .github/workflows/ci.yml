name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: olspillet
          POSTGRES_PASSWORD: olspillet
          POSTGRES_DB: olspillet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olspillet -d olspillet"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://olspillet:olspillet@localhost:5432/olspillet
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=app/engine --cov=tests/engine --cov-report=term-missing --cov-fail-under=100
      - run: uv run alembic upgrade head
      - name: Simulation smoke run
        run: uv run python -m app.sim run batches/classic-smoke.json
      - name: Simulation LLM smoke run (mock provider, worker-ai, report)
        run: bash scripts/sim-llm-smoke.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
