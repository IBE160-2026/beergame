name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: olspillet
          POSTGRES_PASSWORD: olspillet
          POSTGRES_DB: olspillet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olspillet -d olspillet"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://olspillet:olspillet@localhost:5432/olspillet
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=app/engine --cov=tests/engine --cov-report=term-missing --cov-fail-under=100
      - run: uv run alembic upgrade head
      - name: Simulation smoke run
        run: uv run python -m app.sim run batches/classic-smoke.json
      - name: Simulation LLM smoke run (mock provider, worker-ai, report)
        run: bash scripts/sim-llm-smoke.sh
      - name: Prompt versions of stored configs (AD-6)
        run: uv run python -m app.ai.cli prompts check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Copy check (AD-19, UX-DR74)
        run: npm run check:copy
      - run: npm run build # prebuild runs the colour lint (UX-DR1)

  # The typed API client is generated from the FastAPI schema; fail on any drift (AD-10).
  api-client:
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - name: Export the OpenAPI schema
        run: uv run python -m app.openapi ../frontend/src/lib/api/openapi.json
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Regenerate the client types
        run: npm run api:generate
        working-directory: frontend
      - name: Fail on drift (changed, new or deleted files)
        run: |
          git status --porcelain -- frontend/src/lib/api
          test -z "$(git status --porcelain -- frontend/src/lib/api)"

  # Playwright with axe against the compose stack (NFR-6, UX-DR75, UX-DR76).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # worker-batch sends the mails (Story 3.6: the reset test reads its link from the
      # local dev mailbox); worker-ai places the mock AI players' orders (week-advance spec).
      - name: Start the stack
        run: docker compose up -d --build --wait proxy worker-batch worker-ai
      # The proxy rules through the whole stack (AD-11, Story 3.14); the same script watches a
      # production deploy.
      - name: Smoke test
        run: python3 scripts/smoke http://127.0.0.1:8080
      # AD-18 chart spike (Story 6.7): the server-rendered Graf over tabell through WeasyPrint's
      # pdf/ua-1 in worker-batch; fails if a chart is missing, clipped or off its table columns, or
      # a font comes from outside the app.
      - name: Chart PDF check (WeasyPrint)
        run: docker compose exec -T worker-batch python -m app.platform.chart_print_check http://frontend:3000/print/graf-over-tabell
      - run: npm ci
        working-directory: frontend
      # The browser is cached per Playwright version. The apt step for system libraries ran
      # 7 min once on a slow mirror, so it runs only when the cache misses; ubuntu-latest
      # already carries Chromium's libraries.
      - name: Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      # The conformance scan (Story 15.13): every surface at every NFR-6 viewport, recorded rather
      # than failed on (the specs above fail on a violation). `npm run conformance -- --from <dir>`
      # makes the dated report from the artifact.
      - name: Conformance scan
        run: npx playwright test e2e/conformance.spec.ts
        working-directory: frontend
        env:
          CONFORMANCE: "1"
          CONFORMANCE_OUT: conformance-results
      - name: Keep the conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: frontend/conformance-results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Keep the Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down
